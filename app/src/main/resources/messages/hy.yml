message:
  start:
    - "*Բարև!* Ես հետևում եմ ծննդյան օրերին և երբեք չեմ բաց թողնում կարևոր ամսաթիվ։"
    - ""
    - "Նշիր ծննդյան ամսաթիվդ, և ես կուղարկեմ օրերի հաշվարկն ու շնորհավորանքը ճիշտ ժամանակին, քո ժամային գոտում և քո լեզվով։"
  help:
    - "*Ինչ գիտեմ*"
    - ""
    - "/date: նշել կամ փոխել ծննդյան ամսաթիվը"
    - "/notify: միացնել կամ անջատել հիշեցումները"
    - "/daysto: օրեր մինչև ծննդյան օրը"
    - "/dayssince: օրեր ծննդյան օրվանից"
    - "/time: հիշեցման ժամը"
    - "/zone: ժամային գոտի"
    - "/lang: լեզու"
    - "/settings: բոլոր կարգավորումները միանգամից"
    - ""
    - "Հիշեցումները գալիս են ամեն օր ընտրված ժամին, իսկ հենց օրը ստանում ես շնորհավորանք։ Ոչինչ չի կորչում նույնիսկ վերագործարկումից հետո։"
  prompt:
    date:
      - "Մուտքագրիր ծննդյան ամսաթիվդ ցանկացած հարմար ձևով․"
      - ""
      - "`05.03.1998`, `05.03`, `5 մարտի 1998`, `1998-03-05`"
      - ""
      - "Տարին պարտադիր չէ, բայց առանց դրա չեմ կարող հաշվել տարիքդ։ Չեղարկել՝ /cancel"
    time:
      - "Մուտքագրիր հիշեցման ժամը, օր. `12:00` կամ `18`։ Չեղարկել՝ /cancel"
    zone:
      - "Մուտքագրիր ժամային գոտին, օր. `Asia/Yerevan` կամ `UTC+3`։ Չեղարկել՝ /cancel"
  date:
    set:
      - "Պահված է․ *{date}*"
      - ""
      - "Մինչև ծննդյան օրը մնաց {days} {days|plural:one=օր|other=օր}։ Հիշեցումները կգան {time}՝ քո {zone} գոտում։"
    invalid:
      - "Չկարողացա կարդալ ամսաթիվը։ Օրինակներ․ `05.03.1998`, `05.03`, `5 մարտի 1998`, `1998-03-05`։ Փորձիր նորից։"
    year_range: "Այս թվականը վրիպակի է նման: {year}: Ընդունում եմ ծննդյան ամսաթվեր 1900-ից մինչև այսօր ներառյալ:"
  time:
    set:
      - "Հիշեցման ժամը․ *{time}* (քո տեղական ժամը)"
    invalid:
      - "Դա ժամի նման չէ։ Օրինակներ․ `12:00`, `18`, `8:05`։"
  zone:
    choose: "Ընտրիր գոտին ցանկից կամ գրիր քոնը:"
    set:
      - "Ժամային գոտի․ *{zone}*։ Գրաֆիկը վերահաշվարկված է։"
    invalid:
      - "Չգիտեմ այդպիսի գոտի։ Օրինակներ․ `Asia/Yerevan`, `UTC+3`, `America/New_York`։"
  notify:
    "on": "Հիշեցումները *միացված են*։ Կգրեմ գրաֆիկով։"
    "off": "Հիշեցումները *անջատված են*։ Նորից միացրու կոճակով կամ /notify-ով։"
  answer:
    days_to: "Մինչև ծննդյան օրը մնաց {days} {days|plural:one=օր|other=օր}։ Շնորհավորանքը կգա {date}՝ {time}՝ քո {zone} գոտում։"
    days_since: "Ծննդյան օրվանից անցել է {days} {days|plural:one=օր|other=օր}։ Դու {age} {age|plural:one=տարեկան|other=տարեկան} ես։"
    days_since_last: "Վերջին ծննդյան օրվանից անցել է {days} {days|plural:one=օր|other=օր}։"
    no_year:
      - "Ամսաթվում տարի չկա, ուստի ծննդյան օրվանից օրերի ընդհանուր թիվը հնարավոր չէ հաշվել։ Վերջին ծննդյան օրվանից հաշվարկն աշխատում է նաև առանց տարվա․ ներքևի կոճակն անում է դա։"
      - "  Ավելացրու տարի՝ տարիքդ էլ տեսնելու համար․ /date"
    not_set: "Ծննդյան ամսաթիվ դեռ չկա։ Սկսենք։ /date"
  settings:
    view:
      - "*Քո կարգավորումները*"
      - ""
      - "Ծննդյան ամսաթիվ․ {date}"
      - "Հիշեցման ժամը․ {time}"
      - "Ժամային գոտի․ {zone}"
      - "Հիշեցումներ․ {notify}"
      - "Լեզու․ {lang}"
    not_set: "նշված չէ"
    "on": "Միացված"
    "off": "Անջատված"
  lang:
    choose: "Ընտրիր լեզու․"
    set: "Լեզուն փոխվեց․ {lang}"
  cancelled: "Չեղարկված է։ Ոչ մի կարգավորում չփոխվեց։"
  reloaded: "Հաղորդագրություններն ու ստեղնաշարերը նորից ընթերցվեցին YAML-ից։"
  perm:
    not: "Այս հրամանը միայն բոտի տիրոջ համար է։"

  delete:
    confirm:
      - "Ջնջե՞լ քո բոլոր տվյալները (ամսաթիվ, կարգավորումներ, հիշեցումների պատմություն)։"
      - ""
      - "Սա անշրջելի է․ պրոֆիլն ու առաքման մատյանը կջնջվեն։"
    done: "Տվյալները ջնջված են։ Վերադարձիր /start-ով"
  pointer:
    dm: "Պատասխանեցի անձնական հաղորդագրություններում"
  flood: "Չափազանց արագ։ Փորձիր մի քանի վայրկյան հետո։"
  about:
    - "*Birthday Bot*-ը մշակվում է բաց․ սկզբնական կոդը հանրային է։"
    - ""
    - "Սկզբնական կոդը GitHub-ում է․ {url}"
    - "Նախագիծը զարգացնում եմ մենակ և շնորհակալ կլինեմ աստղի համար։ Դա նաև իմ պորտֆոլիոն է IT Management ընդունվելու համար։"
    - ""
    - "Շնորհակալություն, որ օգտվում ես։"

reminder:
  countdown:
    - "Մինչև ծննդյան օրդ մնաց {days} {days|plural:one=օր|other=օր}։"
    - ""
    - "Շնորհավորանքը կգա {date}՝ {time}՝ քո {zone} գոտում։ Լավ օր։"
  birthday:
    - "*Ծնունդդ շնորհավո՛ր!* Դու դարձար {age} {age|plural:one=տարեկան|other=տարեկան}։"
    - ""
    - "Լավ օր և հիանալի տարի։"
  birthday.no_year:
    - "*Ծնունդդ շնորհավո՛ր!* Այսօր քո օրն է։"
    - ""
    - "Լավ օր և հիանալի տարի։"

