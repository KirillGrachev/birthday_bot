message:
  start:
    - "*Привіт!* Я стежу за днями народження і ніколи не пропускаю важливі дати."
    - ""
    - "Вкажи дату народження, і я надсилатиму відлік днів і привітання точно вчасно, у твоєму часовому поясі та твоєю мовою."
  help:
    - "*Що я вмію*"
    - ""
    - "/date: вказати або змінити дату народження"
    - "/notify: увімкнути або вимкнути нагадування"
    - "/daysto: скільки днів до дня народження"
    - "/dayssince: скільки днів від дня народження"
    - "/time: час нагадування"
    - "/zone: часовий пояс"
    - "/lang: мова"
    - "/settings: усі налаштування одразу"
    - ""
    - "Нагадування приходять щодня в обраний час, а в сам день ти отримуєш привітання. Нічого не пропускається навіть після перезапуску."
  prompt:
    date:
      - "Введи дату народження у будь-якому зручному форматі:"
      - ""
      - "`05.03.1998`, `05.03`, `5 березня 1998`, `1998-03-05`"
      - ""
      - "Рік вказувати не обов'язково, але без нього я не порахую вік. Скасування: /cancel"
    time:
      - "Введи час нагадування, наприклад `12:00` або `18`. Скасування: /cancel"
    zone:
      - "Введи часовий пояс, наприклад `Europe/Kyiv` або `UTC+3`. Скасування: /cancel"
  date:
    set:
      - "Зберіг дату: *{date}*"
      - ""
      - "До дня народження залишилося {days} {days|plural:one=день|few=дні|many=днів}. Нагадування приходитимуть о {time} за поясом {zone}."
    invalid:
      - "Не зміг розібрати дату. Приклади: `05.03.1998`, `05.03`, `5 березня 1998`, `1998-03-05`. Спробуй ще раз."
    year_range: "Схоже на одрук у році: {year}. Приймаю дати народження з 1900 року по сьогодні включно."
  time:
    set:
      - "Час нагадування: *{time}* (за твоїм поясом)"
    invalid:
      - "Не схоже на час. Приклади: `12:00`, `18`, `8:05`."
  zone:
    choose: "Обери часовий пояс зі списку або введи свій:"
    set:
      - "Часовий пояс: *{zone}*. Розклад перераховано."
    invalid:
      - "Не знаю такого поясу. Приклади: `Europe/Kyiv`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Нагадування *увімкнені*. Писатиму за розкладом."
    "off": "Нагадування *вимкнені*. Увімкнути знову можна кнопкою або командою /notify."
  answer:
    days_to: "До дня народження залишилося {days} {days|plural:one=день|few=дні|many=днів}. Привітання прийде {date} о {time} за поясом {zone}."
    days_since: "Від дня народження минуло {days} {days|plural:one=день|few=дні|many=днів}. Тобі {age} {age|plural:one=рік|few=роки|many=років}."
    days_since_last: "Від останнього дня народження минуло {days} {days|plural:one=день|few=дні|many=днів}."
    no_year:
      - "У даті немає року, тому загальну кількість днів від народження порахувати не можу. Лічба від останнього дня народження працює і без року: кнопка нижче це робить."
      - ""
      - "Додай рік, щоб бачити й вік: /date"
    not_set: "Дати народження ще немає. Почнемо? /date"
  settings:
    view:
      - "*Твої налаштування*"
      - ""
      - "Дата народження: {date}"
      - "Час нагадування: {time}"
      - "Часовий пояс: {zone}"
      - "Нагадування: {notify}"
      - "Мова: {lang}"
    not_set: "не вказано"
    "on": "Увімкнені"
    "off": "Вимкнені"
  lang:
    choose: "Обери мову:"
    set: "Мову перемкнено: {lang}"
  cancelled: "Скасовано. Жодного налаштування не торкнувся."
  reloaded: "Повідомлення та клавіатури перечитано з YAML."
  perm:
    not: "Команда доступна лише власнику бота."

  delete:
    confirm:
      - "Видалити всі твої дані (дату, налаштування, історію нагадувань)?"
      - ""
      - "Це незворотно: профіль і журнал доставок буде стерто."
    done: "Дані видалено. Повертайся через /start"
  pointer:
    dm: "Відповів у приватні повідомлення"
  flood: "Зачасто. Повтори за кілька секунд."
  about:
    - "Проєкт *Birthday Bot* має відкритий код."
    - ""
    - "Вихідний код відкрито на GitHub: {url}"
    - "Я розвиваю проєкт сам і буду вдячний за зірочку. Це ще й моє портфоліо для вступу на IT Management."
    - ""
    - "Дякую, що користуєшся."

reminder:
  countdown:
    - "До твого дня народження залишилося {days} {days|plural:one=день|few=дні|many=днів}!"
    - ""
    - "Привітання прийде {date} о {time} за поясом {zone}. Гарного дня!"
  birthday:
    - "*З днем народження!* Тобі виповнюється {age} {age|plural:one=рік|few=роки|many=років}."
    - ""
    - "Гарного дня та чудового року."
  birthday.no_year:
    - "*З днем народження!* Сьогодні твій день."
    - ""
    - "Гарного дня та чудового року."

