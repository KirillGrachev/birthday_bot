message:
  start:
    - "*Сәлем!* Мен туған күндерді бақылаймын және маңызды күнді ешқашан жіберіп алмаймын."
    - ""
    - "Туған күніңді көрсет, мен санақты және құттықтауды дәл уақытында, сенің уақыт белдеуіңде және сенің тіліңде жіберемін."
  help:
    - "*Мен не істей аламын*"
    - ""
    - "/date: туған күнді көрсету немесе өзгерту"
    - "/notify: еске салуды қосу немесе өшіру"
    - "/daysto: туған күнге дейінгі күндер"
    - "/dayssince: туған күннен бергі күндер"
    - "/time: еске салу уақыты"
    - "/zone: уақыт белдеуі"
    - "/lang: тіл"
    - "/settings: барлық баптаулар бірден"
    - ""
    - "Еске салулар таңдаған уақытыңда күн сайын келеді, ал туған күніңнің өзінде құттықтау аласың. Қайта қосудан кейін де ештеңе жоғалмайды."
  prompt:
    date:
      - "Туған күніңді ыңғайлы форматта енгіз:"
      - ""
      - "`05.03.1998`, `05.03`, `5 наурыз 1998`, `1998-03-05`"
      - ""
      - "Жылды көрсету міндетті емес, бірақ онсыз жасыңды есептей алмаймын. Болдырмау: /cancel"
    time:
      - "Еске салу уақытын енгіз, мысалы `12:00` немесе `18`. Болдырмау: /cancel"
    zone:
      - "Уақыт белдеуін енгіз, мысалы `Asia/Almaty` немесе `UTC+3`. Болдырмау: /cancel"
  date:
    set:
      - "Сақталды: *{date}*"
      - ""
      - "Туған күнге дейін {days} {days|plural:one=күн|other=күн} қалды. Еске салулар {time} уақытында, {zone} белдеуінде келеді."
    invalid:
      - "Күнді оқи алмадым. Мысалдар: `05.03.1998`, `05.03`, `5 наурыз 1998`, `1998-03-05`. Қайталап көр."
    year_range: "Бұл жыл қате теруге ұқсайды: {year}. Туған күндерді 1900 жылдан бүгінге дейін қабылдаймын."
  time:
    set:
      - "Еске салу уақыты: *{time}* (сенің жергілікті уақытың)"
    invalid:
      - "Бұл уақытқа ұқсамайды. Мысалдар: `12:00`, `18`, `8:05`."
  zone:
    choose: "Тізімнен белдеуіңді таңда немесе өзіңдікін енгіз:"
    set:
      - "Уақыт белдеуі: *{zone}*. Кесте қайта есептелді."
    invalid:
      - "Мұндай белдеуді білмеймін. Мысалдар: `Asia/Almaty`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Еске салулар *қосулы*. Кесте бойынша жазамын."
    "off": "Еске салулар *өшірулі*. Түрме немесе /notify арқылы қайта қос."
  answer:
    days_to: "Туған күнге дейін {days} {days|plural:one=күн|other=күн} қалды. Құттықтау {date} күні {time} уақытында, {zone} белдеуінде келеді."
    days_since: "Туған күннен бері {days} {days|plural:one=күн|other=күн} өтті. Сен {age} {age|plural:one=жас|other=жас}тасың."
    days_since_last: "Соңғы туған күннен бері {days} {days|plural:one=күн|other=күн} өтті."
    no_year:
      - "Күнде жыл жоқ, сондықтан туған күннен бергі барлық күнді есептей алмаймын. Соңғы туған күннен санау жылсыз да жұмыс істейді: төмендегі түйме соны істейді."
      - ""
      - "Жасыңды да көру үшін жылды қос: /date"
    not_set: "Туған күн әлі көрсетілмеген. Бастаймыз ба? /date"
  settings:
    view:
      - "*Сенің баптауларың*"
      - ""
      - "Туған күн: {date}"
      - "Еске салу уақыты: {time}"
      - "Уақыт белдеуі: {zone}"
      - "Еске салулар: {notify}"
      - "Тіл: {lang}"
    not_set: "көрсетілмеген"
    "on": "Қосулы"
    "off": "Өшірулі"
  lang:
    choose: "Тілді таңда:"
    set: "Тіл ауыстырылды: {lang}"
  cancelled: "Болдырылмады. Ешбір баптау өзгерген жоқ."
  reloaded: "Хабарламалар мен пернетақталар YAML-ден қайта оқылды."
  perm:
    not: "Бұл команда тек бот иесіне арналған."

  delete:
    confirm:
      - "Барлық деректеріңді (күн, баптаулар, еске салу тарихы) жою керек пе?"
      - ""
      - "Бұл қайтымсыз: профиль мен жеткізу журналы өшіріледі."
    done: "Деректер жойылды. /start арқылы орал"
  pointer:
    dm: "Жеке хабарламаларда жауап бердім"
  flood: "Тым жылдам. Бірнеше секундтан кейін қайтала."
  about:
    - "*Birthday Bot* ашық әзірленеді: бастапқы код жария."
    - ""
    - "Бастапқы код GitHub-та: {url}"
    - "Жобаны жалғыз өзім дамытамын және жұлдызшаға риза болар едім. Бұл сонымен қатар IT Management-ке түсуге арналған портфолиом."
    - ""
    - "Қолданғаның үшін рақмет."

reminder:
  countdown:
    - "Туған күніңе дейін {days} {days|plural:one=күн|other=күн} қалды!"
    - ""
    - "Құттықтау {date} күні {time} уақытында, {zone} белдеуінде келеді. Жақсы күн тілеймін!"
  birthday:
    - "*Туған күніңмен!* Сен {age} {age|plural:one=жас|other=жас}қа толдың."
    - ""
    - "Жақсы күн және керемет жыл болсын."
  birthday.no_year:
    - "*Туған күніңмен!* Бүгін сенің күнің."
    - ""
    - "Жақсы күн және керемет жыл болсын."

