message:
  start:
    - "*Hi there!* I keep track of birthdays and never miss an important date."
    - ""
    - "Set your birthdate, and I will send the countdown and a greeting right on time, in your timezone and your language."
  help:
    - "*What I can do*"
    - ""
    - "/date: set or change your birthdate"
    - "/notify: turn reminders on or off"
    - "/daysto: days until your birthday"
    - "/dayssince: days since your birthday"
    - "/time: reminder time"
    - "/zone: timezone"
    - "/lang: language"
    - "/settings: all settings at once"
    - ""
    - "Reminders arrive daily at your chosen time, and on the day itself you get a greeting. Nothing is missed, even after a restart."
  prompt:
    date:
      - "Enter your birthdate in any convenient format:"
      - ""
      - "`05.03.1998`, `05.03`, `March 5, 1998`, `1998-03-05`"
      - ""
      - "The year is optional, but without it I cannot compute your age. Cancel: /cancel"
    time:
      - "Enter the reminder time, e.g. `12:00` or `18`. Cancel: /cancel"
    zone:
      - "Enter your timezone, e.g. `Europe/London` or `UTC+3`. Cancel: /cancel"
  date:
    set:
      - "Saved: *{date}*"
      - ""
      - "{days} {days|plural:one=day|other=days} left until your birthday. Reminders will arrive at {time} in your timezone: {zone}."
    invalid:
      - "Could not parse the date. Examples: `05.03.1998`, `05.03`, `March 5, 1998`, `1998-03-05`. Try again."
    year_range: "That year looks like a typo: {year}. I support birthdates from 1900 up to and including today."
  time:
    set:
      - "Reminder time: *{time}* (your local time)"
    invalid:
      - "That does not look like a time. Examples: `12:00`, `18`, `8:05`."
  zone:
    choose: "Choose your timezone from the list, or enter your own:"
    set:
      - "Timezone: *{zone}*. Schedule recalculated."
    invalid:
      - "Unknown timezone. Examples: `Europe/London`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Reminders are *on*. I will write on schedule."
    "off": "Reminders are *off*. Bring them back with the button or /notify."
  answer:
    days_to: "{days} {days|plural:one=day|other=days} left until your birthday. The greeting arrives on {date} at {time} in your timezone: {zone}."
    days_since: "{days} {days|plural:one=day|other=days} have passed since your birth. You are {age} {age|plural:one=year|other=years} old."
    days_since_last: "{days} {days|plural:one=day|other=days} have passed since your last birthday."
    no_year:
      - "The date has no year, so the total count of days since your birth is impossible. Counting from the last birthday works without a year: the button below does it."
      - ""
      - "Add a year to see your age too: /date"
    not_set: "No birthdate yet. Shall we start? /date"
  settings:
    view:
      - "*Your settings*"
      - ""
      - "Birthdate: {date}"
      - "Reminder time: {time}"
      - "Timezone: {zone}"
      - "Reminders: {notify}"
      - "Language: {lang}"
    not_set: "not set"
    "on": "On"
    "off": "Off"
  lang:
    choose: "Choose your language:"
    set: "Language switched: {lang}"
  cancelled: "Cancelled. No settings were changed."
  reloaded: "Messages and keyboards reloaded from YAML."
  perm:
    not: "This command is owner-only."

  delete:
    confirm:
      - "Delete all your data (date, settings, reminder history)?"
      - ""
      - "This is irreversible: profile and delivery log will be erased."
    done: "Data deleted. Come back via /start"
  pointer:
    dm: "Answered in direct messages"
  flood: "Too fast. Try again in a few seconds."
  about:
    - "*Birthday Bot* is developed in the open: its source code is public."
    - ""
    - "The source code is on GitHub: {url}"
    - "I develop this project on my own and would appreciate a star. It also serves as my portfolio for applying to IT Management."
    - ""
    - "Thanks for using it."

reminder:
  countdown:
    - "{days} {days|plural:one=day|other=days} left until your birthday!"
    - ""
    - "The greeting arrives on {date} at {time} in your timezone: {zone}. Have a great day!"
  birthday:
    - "*Happy birthday!* You are turning {age} {age|plural:one=year|other=years}."
    - ""
    - "Have a great day and a great year."
  birthday.no_year:
    - "*Happy birthday!* Today is your day."
    - ""
    - "Have a great day and a great year."

