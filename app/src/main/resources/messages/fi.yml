message:
  start:
    - "*Hei!* Seuraan syntymäpäiviä enkä koskaan päästä tärkeää päivämäärää karkaamaan."
    - ""
    - "Aseta syntymäpäiväsi, niin lähetän päivälaskurin ja onnittelun täsmälleen ajoissa, omalla aikavyöhykkeelläsi ja omalla kielelläsi."
  help:
    - "*Mitä osaan*"
    - ""
    - "/date: aseta tai vaihda syntymäpäivä"
    - "/notify: muistutukset päälle tai pois"
    - "/daysto: päiviä syntymäpäivään"
    - "/dayssince: päiviä syntymäpäivästä"
    - "/time: muistutuksen kellonaika"
    - "/zone: aikavyöhyke"
    - "/lang: kieli"
    - "/settings: kaikki asetukset kerralla"
    - ""
    - "Muistutukset tulevat päivittäin valitsemanasi aikana, ja itse päivänä saat onnittelun. Mikään ei jää väliin, ei edes uudelleenkäynnistyksen jälkeen."
  prompt:
    date:
      - "Syötä syntymäpäiväsi missä tahansa muodossa:"
      - ""
      - "`05.03.1998`, `05.03`, `5. maaliskuuta 1998`, `1998-03-05`"
      - ""
      - "Vuosi on valinnainen, mutta ilman sitä en osaa laskea ikääsi. Peruutus: /cancel"
    time:
      - "Syötä muistutuksen kellonaika, esim. `12:00` tai `18`. Peruutus: /cancel"
    zone:
      - "Syötä aikavyöhyke, esim. `Europe/Helsinki` tai `UTC+3`. Peruutus: /cancel"
  date:
    set:
      - "Tallennettu: *{date}*"
      - ""
      - "Syntymäpäivään on {days} {days|plural:one=päivä|other=päivää}. Muistutukset tulevat kello {time} vyöhykkeelläsi {zone}."
    invalid:
      - "En saanut päivämäärää selvitettyä. Esimerkkejä: `05.03.1998`, `05.03`, `5. maaliskuuta 1998`, `1998-03-05`. Yritä uudelleen."
    year_range: "Vuosi näyttää kirjoitusvirheeltä: {year}. Hyväksyn syntymäpäivät 1900:sta tähän päivään mukaan lukien."
  time:
    set:
      - "Muistutuksen kellonaika: *{time}* (oma paikallinen aikasi)"
    invalid:
      - "Tuo ei näytä kellonajalta. Esimerkkejä: `12:00`, `18`, `8:05`."
  zone:
    choose: "Valitse aikavyöhykkeesi listalta tai syötä oma:"
    set:
      - "Aikavyöhyke: *{zone}*. Aikataulu laskettu uudelleen."
    invalid:
      - "En tunne tuota vyöhykettä. Esimerkkejä: `Europe/Helsinki`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Muistutukset ovat *päällä*. Kirjoitan aikataulun mukaan."
    "off": "Muistutukset ovat *pois päältä*. Kytke ne takaisin painikkeella tai komennolla /notify."
  answer:
    days_to: "Syntymäpäivään on {days} {days|plural:one=päivä|other=päivää}. Onnittelu saapuu {date} kello {time} vyöhykkeelläsi {zone}."
    days_since: "Syntymästäsi on kulunut {days} {days|plural:one=päivä|other=päivää}. Olet {age} {age|plural:one=vuoden|other=vuotta} vanha."
    days_since_last: "Viime syntymäpäivästäsi on kulunut {days} {days|plural:one=päivä|other=päivää}."
    no_year:
      - "Päivämäärässä ei ole vuotta, joten syntymästä kuluneiden päivien kokonaismäärää ei voi laskea. Laskenta viime syntymäpäivästä toimii ilman vuotta: alla oleva painike tekee sen."
      - "  Lisää vuosi, niin näet myös iän: /date"
    not_set: "Syntymäpäivää ei ole vielä asetettu. Aloitetaanko? /date"
  settings:
    view:
      - "*Omat asetuksesi*"
      - ""
      - "Syntymäpäivä: {date}"
      - "Muistutuksen kellonaika: {time}"
      - "Aikavyöhyke: {zone}"
      - "Muistutukset: {notify}"
      - "Kieli: {lang}"
    not_set: "ei asetettu"
    "on": "Päällä"
    "off": "Pois päältä"
  lang:
    choose: "Valitse kieli:"
    set: "Kieli vaihdettu: {lang}"
  cancelled: "Peruutettu. Mitään asetusta ei muutettu."
  reloaded: "Viestit ja näppäimistöt luettu uudelleen YAML-tiedostosta."
  perm:
    not: "Tämä komento on vain omistajalle."

  delete:
    confirm:
      - "Poistetaanko kaikki tietosi (päivämäärä, asetukset, muistutushistoria)?"
      - ""
      - "Tämä on peruuttamatonta: profiili ja toimitusloki pyyhitään."
    done: "Tiedot poistettu. Palaa komennolla /start"
  pointer:
    dm: "Vastasin yksityisviestissä"
  flood: "Liian nopeasti. Yritä muutaman sekunnin kuluttua."
  about:
    - "*Birthday Bot* kehittyy avoimesti: lähdekoodi on julkinen."
    - ""
    - "Lähdekoodi on GitHubissa: {url}"
    - "Kehitän projektia yksin ja olisin kiitollinen tähdestä. Se on myös portfolioni IT Management -hakuun."
    - ""
    - "Kiitos, että käytät."

reminder:
  countdown:
    - "Syntymäpäivääsi on {days} {days|plural:one=päivä|other=päivää}!"
    - ""
    - "Onnittelu saapuu {date} kello {time} vyöhykkeelläsi {zone}. Hyvää päivää!"
  birthday:
    - "*Onnea syntymäpäivänäsi!* Täytät {age} {age|plural:one=vuoden|other=vuotta}."
    - ""
    - "Hyvää päivää ja mainiota vuotta."
  birthday.no_year:
    - "*Onnea syntymäpäivänäsi!* Tänään on sinun päiväsi."
    - ""
    - "Hyvää päivää ja mainiota vuotta."

