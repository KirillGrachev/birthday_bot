message:
  start:
    - "*Hej!* Jeg holder styr på fødselsdage og misser aldrig en vigtig dato."
    - ""
    - "Angiv din fødselsdato, så sender jeg nedtællingen og en fødselsdagshilsen præcis til tiden, i din tidszone og på dit sprog."
  help:
    - "*Hvad jeg kan*"
    - ""
    - "/date: angiv eller ændr din fødselsdato"
    - "/notify: slå påmindelser til eller fra"
    - "/daysto: dage til din fødselsdag"
    - "/dayssince: dage siden din fødselsdag"
    - "/time: tidspunkt for påmindelsen"
    - "/zone: tidszone"
    - "/lang: sprog"
    - "/settings: alle indstillinger på én gang"
    - ""
    - "Påmindelserne kommer dagligt på det valgte tidspunkt, og på selve dagen får du en hilsen. Intet bliver glemt, heller ikke efter genstart."
  prompt:
    date:
      - "Indtast din fødselsdato i et valgfrit format:"
      - ""
      - "`05.03.1998`, `05.03`, `5. marts 1998`, `1998-03-05`"
      - ""
      - "Året er valgfrit, men uden det kan jeg ikke beregne din alder. Annuller: /cancel"
    time:
      - "Indtast tidspunktet for påmindelsen, fx `12:00` eller `18`. Annuller: /cancel"
    zone:
      - "Indtast din tidszone, fx `Europe/Copenhagen` eller `UTC+3`. Annuller: /cancel"
  date:
    set:
      - "Gemt: *{date}*"
      - ""
      - "Der er {days} {days|plural:one=dag|other=dage} til din fødselsdag. Påmindelserne kommer kl. {time} i din tidszone {zone}."
    invalid:
      - "Jeg kunne ikke læse datoen. Eksempler: `05.03.1998`, `05.03`, `5. marts 1998`, `1998-03-05`. Prøv igen."
    year_range: "Det år ligner en tastefejl: {year}. Jeg tager imod fødselsdatoer fra 1900 til og med i dag."
  time:
    set:
      - "Tidspunkt for påmindelsen: *{time}* (din lokale tid)"
    invalid:
      - "Det ligner ikke et tidspunkt. Eksempler: `12:00`, `18`, `8:05`."
  zone:
    choose: "Vælg din tidszone fra listen eller indtast din egen:"
    set:
      - "Tidszone: *{zone}*. Planen er genberegnet."
    invalid:
      - "Den tidszone kender jeg ikke. Eksempler: `Europe/Copenhagen`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Påmindelser er *til*. Jeg skriver efter planen."
    "off": "Påmindelser er *fra*. Slå dem til igen med knappen eller /notify."
  answer:
    days_to: "Der er {days} {days|plural:one=dag|other=dage} til din fødselsdag. Hilsenen kommer {date} kl. {time} i din tidszone {zone}."
    days_since: "Der er gået {days} {days|plural:one=dag|other=dage} siden din fødsel. Du er {age} {age|plural:one=år|other=år} gammel."
    days_since_last: "Der er gået {days} {days|plural:one=dag|other=dage} siden din sidste fødselsdag."
    no_year:
      - "Datoen har ikke noget årstal, så det samlede antal dage siden fødslen kan ikke beregnes. Optællingen fra den sidste fødselsdag virker uden årstal: knappen nedenfor gør det."
      - ""
      - "Tilføj et årstal for også at se din alder: /date"
    not_set: "Ingen fødselsdato endnu. Skal vi starte? /date"
  settings:
    view:
      - "*Dine indstillinger*"
      - ""
      - "Fødselsdato: {date}"
      - "Tidspunkt for påmindelse: {time}"
      - "Tidszone: {zone}"
      - "Påmindelser: {notify}"
      - "Sprog: {lang}"
    not_set: "ikke angivet"
    "on": "Til"
    "off": "Fra"
  lang:
    choose: "Vælg sprog:"
    set: "Sproget er skiftet: {lang}"
  cancelled: "Annulleret. Ingen indstillinger blev ændret."
  reloaded: "Beskeder og tastaturer er genindlæst fra YAML."
  perm:
    not: "Denne kommando er kun for ejeren."

  delete:
    confirm:
      - "Slet alle dine data (dato, indstillinger, påmindelseshistorik)?"
      - ""
      - "Det kan ikke fortrydes: profil og leveringslog bliver slettet."
    done: "Data slettet. Kom tilbage via /start"
  pointer:
    dm: "Svarede i direkte beskeder"
  flood: "For hurtigt. Prøv igen om et par sekunder."
  about:
    - "*Birthday Bot* udvikles åbent: kildekoden er offentlig."
    - ""
    - "Kildekoden ligger på GitHub: {url}"
    - "Jeg udvikler projektet alene og ville være taknemlig for en stjerne. Det er også mit portfolio til ansøgningen om IT Management."
    - ""
    - "Tak fordi du bruger den."

reminder:
  countdown:
    - "Der er {days} {days|plural:one=dag|other=dage} til din fødselsdag!"
    - ""
    - "Hilsenen kommer {date} kl. {time} i din tidszone {zone}. God dag!"
  birthday:
    - "*Tillykke med fødselsdagen!* Du fylder {age} {age|plural:one=år|other=år}."
    - ""
    - "God dag og godt år."
  birthday.no_year:
    - "*Tillykke med fødselsdagen!* I dag er din dag."
    - ""
    - "God dag og godt år."

