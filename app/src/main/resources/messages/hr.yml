message:
  start:
    - "*Bok!* Pratim rođendane i nikad ne propustim važan datum."
    - ""
    - "Postavi svoj datum rođenja i slat ću odbrojavanje i čestitku točno na vrijeme, u tvojoj vremenskoj zoni i na tvom jeziku."
  help:
    - "*Što znam*"
    - ""
    - "/date: postavi ili promijeni datum rođenja"
    - "/notify: uključi ili isključi podsjetnike"
    - "/daysto: dana do rođendana"
    - "/dayssince: dana od rođenja"
    - "/time: vrijeme podsjetnika"
    - "/zone: vremenska zona"
    - "/lang: jezik"
    - "/settings: sve postavke odjednom"
    - ""
    - "Podsjetnici stižu svaki dan u odabrano vrijeme, a na sam dan dobivaš čestitku. Ništa se ne propusti, ni nakon ponovnog pokretanja."
  prompt:
    date:
      - "Upiši datum rođenja u bilo kojem obliku:"
      - ""
      - "`05.03.1998`, `05.03`, `5. ožujka 1998`, `1998-03-05`"
      - ""
      - "Godina nije obavezna, ali bez nje ne mogu izračunati dob. Odustani: /cancel"
    time:
      - "Upiši vrijeme podsjetnika, npr. `12:00` ili `18`. Odustani: /cancel"
    zone:
      - "Upiši vremensku zonu, npr. `Europe/Zagreb` ili `UTC+3`. Odustani: /cancel"
  date:
    set:
      - "Spremljeno: *{date}*"
      - ""
      - "Do rođendana je ostalo {days} {days|plural:one=dan|few=dana|other=dana}. Podsjetnici će stizati u {time} po zoni {zone}."
    invalid:
      - "Nisam pročitao datum. Primjeri: `05.03.1998`, `05.03`, `5. ožujka 1998`, `1998-03-05`. Pokušaj ponovno."
    year_range: "Ta godina izgleda kao tipfeler: {year}. Prihvaćam datume rođenja od 1900. do danas uključivo."
  time:
    set:
      - "Vrijeme podsjetnika: *{time}* (tvoje lokalno vrijeme)"
    invalid:
      - "To ne izgleda kao vrijeme. Primjeri: `12:00`, `18`, `8:05`."
  zone:
    choose: "Odaberi svoju zonu s popisa ili upiši svoju:"
    set:
      - "Vremenska zona: *{zone}*. Raspored je preračunat."
    invalid:
      - "Ne poznajem takvu zonu. Primjeri: `Europe/Zagreb`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Podsjetnici su *uključeni*. Pisat ću po rasporedu."
    "off": "Podsjetnici su *isključeni*. Vrati ih gumbom ili naredbom /notify."
  answer:
    days_to: "Do rođendana je ostalo {days} {days|plural:one=dan|few=dana|other=dana}. Čestitka stiže {date} u {time} po zoni {zone}."
    days_since: "Od rođenja je prošlo {days} {days|plural:one=dan|few=dana|other=dana}. Imaš {age} {age|plural:one=godinu|few=godine|other=godina}."
    days_since_last: "Od posljednjeg rođendana prošlo je {days} {days|plural:one=dan|few=dana|other=dana}."
    no_year:
      - "Datum nema godinu, pa se ukupan broj dana od rođenja ne može izračunati. Brojanje od posljednjeg rođendana radi i bez godine: gumb ispod to radi."
      - "  Dodaj godinu da vidiš i dob: /date"
    not_set: "Datum rođenja još nije postavljen. Počinjemo li? /date"
  settings:
    view:
      - "*Tvoje postavke*"
      - ""
      - "Datum rođenja: {date}"
      - "Vrijeme podsjetnika: {time}"
      - "Vremenska zona: {zone}"
      - "Podsjetnici: {notify}"
      - "Jezik: {lang}"
    not_set: "nije postavljeno"
    "on": "Uključeni"
    "off": "Isključeni"
  lang:
    choose: "Odaberi jezik:"
    set: "Jezik je promijenjen: {lang}"
  cancelled: "Otkazano. Nijedna postavka nije dirnuta."
  reloaded: "Poruke i tipkovnice ponovno su učitane iz YAML-a."
  perm:
    not: "Ova naredba je samo za vlasnika."

  delete:
    confirm:
      - "Obrisati sve tvoje podatke (datum, postavke, povijest podsjetnika)?"
      - ""
      - "Nepovratno je: profil i dnevnik dostave bit će obrisani."
    done: "Podaci obrisani. Vrati se preko /start"
  pointer:
    dm: "Odgovorio sam u izravne poruke"
  flood: "Prebrzo. Pokušaj za nekoliko sekundi."
  about:
    - "*Birthday Bot* razvija se otvoreno: izvorni kod je javan."
    - ""
    - "Izvorni kod je na GitHubu: {url}"
    - "Projekt razvijam sam i bit ću zahvalan na zvjezdici. To mi je i portfelj za prijavu na IT Management."
    - ""
    - "Hvala ti što ga koristiš."

reminder:
  countdown:
    - "Do tvog rođendana ostalo je {days} {days|plural:one=dan|few=dana|other=dana}!"
    - ""
    - "Čestitka stiže {date} u {time} po zoni {zone}. Ugodan dan!"
  birthday:
    - "*Sretan rođendan!* Puniš {age} {age|plural:one=godinu|few=godine|other=godina}."
    - ""
    - "Ugodan dan i odlična godina."
  birthday.no_year:
    - "*Sretan rođendan!* Danas je tvoj dan."
    - ""
    - "Ugodan dan i odlična godina."

