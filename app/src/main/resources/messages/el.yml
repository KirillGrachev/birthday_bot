message:
  start:
    - "*Γεια σου!* Παρακολουθώ τα γενέθλια και δεν χάνω ποτέ μια σημαντική ημερομηνία."
    - ""
    - "Βάλε την ημερομηνία γέννησής σου και θα στέλνω την αντίστροφη μέτρηση και την ευχή ακριβώς στην ώρα τους, στη ζώνη σου και στη γλώσσα σου."
  help:
    - "*Τι ξέρω να κάνω*"
    - ""
    - "/date: βάλε ή άλλαξε την ημερομηνία γέννησης"
    - "/notify: ενεργοποίηση ή απενεργοποίηση υπενθυμίσεων"
    - "/daysto: ημέρες μέχρι τα γενέθλια"
    - "/dayssince: ημέρες από τα γενέθλια"
    - "/time: ώρα υπενθύμισης"
    - "/zone: ζώνη ώρας"
    - "/lang: γλώσσα"
    - "/settings: όλες οι ρυθμίσεις μαζί"
    - ""
    - "Οι υπενθυμίσεις έρχονται καθημερινά την ώρα που διάλεξες, και την ίδια τη μέρα παίρνεις ευχή. Τίποτα δεν χάνεται, ούτε μετά από επανεκκίνηση."
  prompt:
    date:
      - "Βάλε την ημερομηνία γέννησης σε όποια μορφή σου βολεύει:"
      - ""
      - "`05.03.1998`, `05.03`, `5 Μαρτίου 1998`, `1998-03-05`"
      - ""
      - "Το έτος είναι προαιρετικό, αλλά χωρίς αυτό δεν υπολογίζω την ηλικία. Ακύρωση: /cancel"
    time:
      - "Βάλε την ώρα της υπενθύμισης, π.χ. `12:00` ή `18`. Ακύρωση: /cancel"
    zone:
      - "Βάλε τη ζώνη ώρας, π.χ. `Europe/Athens` ή `UTC+3`. Ακύρωση: /cancel"
  date:
    set:
      - "Αποθηκεύτηκε: *{date}*"
      - ""
      - "Απομένουν {days} {days|plural:one=μέρα|other=μέρες} μέχρι τα γενέθλια. Οι υπενθυμίσεις θα έρχονται στις {time} στη ζώνη {zone}."
    invalid:
      - "Δεν κατάλαβα την ημερομηνία. Παραδείγματα: `05.03.1998`, `05.03`, `5 Μαρτίου 1998`, `1998-03-05`. Δοκίμασε ξανά."
    year_range: "Αυτό το έτος μοιάζει με ορθογραφικό λάθος: {year}. Δέχομαι ημερομηνίες γέννησης από το 1900 έως και σήμερα."
  time:
    set:
      - "Ώρα υπενθύμισης: *{time}* (η τοπική σου ώρα)"
    invalid:
      - "Αυτό δεν μοιάζει με ώρα. Παραδείγματα: `12:00`, `18`, `8:05`."
  zone:
    choose: "Διάλεξε τη ζώνη σου από τη λίστα ή γράψε τη δική σου:"
    set:
      - "Ζώνη ώρας: *{zone}*. Το πρόγραμμα υπολογίστηκε ξανά."
    invalid:
      - "Δεν ξέρω τέτοια ζώνη. Παραδείγματα: `Europe/Athens`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Οι υπενθυμίσεις είναι *ενεργές*. Θα γράφω σύμφωνα με το πρόγραμμα."
    "off": "Οι υπενθυμίσεις είναι *ανενεργές*. Ενεργοποίησέ ξανά με το κουμπί ή με /notify."
  answer:
    days_to: "Απομένουν {days} {days|plural:one=μέρα|other=μέρες} μέχρι τα γενέθλια. Η ευχή θα έρθει στις {date} στις {time} στη ζώνη {zone}."
    days_since: "Πέρασαν {days} {days|plural:one=μέρα|other=μέρες} από τη γέννησή σου. Είσαι {age} {age|plural:one=έτους|other=χρονών}."
    days_since_last: "Πέρασαν {days} {days|plural:one=μέρα|other=μέρες} από τα τελευταία σου γενέθλια."
    no_year:
      - "Η ημερομηνία δεν έχει έτος, οπότε το συνολικό πλήθος ημερών από τη γέννηση δεν υπολογίζεται. Η μέτρηση από τα τελευταία γενέθλια λειτουργεί και χωρίς έτος: το κουμπί παρακάτω το κάνει."
      - "  Βάλε έτος για να βλέπεις και την ηλικία: /date"
    not_set: "Δεν υπάρχει ακόμη ημερομηνία γέννησης. Να ξεκινήσουμε; /date"
  settings:
    view:
      - "*Οι ρυθμίσεις σου*"
      - ""
      - "Ημερομηνία γέννησης: {date}"
      - "Ώρα υπενθύμισης: {time}"
      - "Ζώνη ώρας: {zone}"
      - "Υπενθυμίσεις: {notify}"
      - "Γλώσσα: {lang}"
    not_set: "δεν έχει οριστεί"
    "on": "Ενεργές"
    "off": "Ανενεργές"
  lang:
    choose: "Διάλεξε γλώσσα:"
    set: "Η γλώσσα άλλαξε: {lang}"
  cancelled: "Ακυρώθηκε. Δεν πείραξα καμία ρύθμιση."
  reloaded: "Τα μηνύματα και τα πληκτρολόγια ξαναφορτώθηκαν από YAML."
  perm:
    not: "Αυτή η εντολή είναι μόνο για τον ιδιοκτήτη."

  delete:
    confirm:
      - "Να διαγράψω όλα τα δεδομένα σου (ημερομηνία, ρυθμίσεις, ιστορικό υπενθυμίσεων);"
      - ""
      - "Είναι μη αναστρέψιμο: το προφίλ και το ημερολόγιο αποστολών θα σβηστούν."
    done: "Τα δεδομένα διαγράφηκαν. Επιστροφή μέσω /start"
  pointer:
    dm: "Απάντησα σε απευθείας μηνύματα"
  flood: "Πολύ γρήγορα. Δοκίμασε σε λίγα δευτερόλεπτα."
  about:
    - "Το *Birthday Bot* αναπτύσσεται ανοιχτά: ο πηγαίος κώδικας είναι δημόσιος."
    - ""
    - "Ο πηγαίος κώδικας είναι στο GitHub: {url}"
    - "Αναπτύσσω το έργο μόνος μου και θα εκτιμούσα ένα αστέρι. Είναι και πορτοφόλιο μου για την αίτηση στο IT Management."
    - ""
    - "Ευχαριστώ που το χρησιμοποιείς."

reminder:
  countdown:
    - "Απομένουν {days} {days|plural:one=μέρα|other=μέρες} μέχρι τα γενέθλιά σου!"
    - ""
    - "Η ευχή θα έρθει στις {date} στις {time} στη ζώνη {zone}. Καλή μέρα!"
  birthday:
    - "*Χρόνια πολλά!* Γίνεσαι {age} {age|plural:one=έτους|other=χρονών}."
    - ""
    - "Καλή μέρα και υπέροχη χρονιά."
  birthday.no_year:
    - "*Χρόνια πολλά!* Σήμερα είναι η μέρα σου."
    - ""
    - "Καλή μέρα και υπέροχη χρονιά."

