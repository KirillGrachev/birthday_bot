message:
  start:
    - "*Привет!* Я слежу за днями рождения и никогда не пропускаю важные даты."
    - ""
    - "Укажи дату рождения, и я буду присылать отсчёт дней и поздравление точно в срок, в твоём часовом поясе и на твоём языке."
  help:
    - "*Что я умею*"
    - ""
    - "/date: указать или изменить дату рождения"
    - "/notify: включить или выключить напоминания"
    - "/daysto: сколько дней до дня рождения"
    - "/dayssince: сколько дней со дня рождения"
    - "/time: время напоминания"
    - "/zone: часовой пояс"
    - "/lang: язык"
    - "/settings: все настройки сразу"
    - ""
    - "Напоминания приходят ежедневно в выбранное время, а в сам день рождения я поздравляю тебя. Ничего не пропущу даже после перезапуска."
  prompt:
    date:
      - "Введи дату рождения в любом удобном формате:"
      - ""
      - "`05.03.1998`, `05.03`, `5 марта 1998`, `1998-03-05`"
      - ""
      - "Год указывать не обязательно, но без него я не посчитаю возраст. Отмена: /cancel"
    time:
      - "Введи время напоминания, например `12:00` или `18`. Отмена: /cancel"
    zone:
      - "Введи часовой пояс, например `Europe/Moscow` или `UTC+3`. Отмена: /cancel"
  date:
    set:
      - "Сохранил дату: *{date}*"
      - ""
      - "До дня рождения осталось {days} {days|plural:one=день|few=дня|many=дней}. Напоминания будут приходить в {time} по поясу {zone}."
    invalid:
      - "Не смог разобрать дату. Примеры: `05.03.1998`, `05.03`, `5 марта 1998`, `1998-03-05`. Попробуй ещё раз."
    year_range: "Похоже на опечатку в годе: {year}. Поддерживаю даты рождения с 1900 года по сегодня включительно."
  time:
    set:
      - "Время напоминания: *{time}* (по твоему поясу)"
    invalid:
      - "Не похоже на время. Примеры: `12:00`, `18`, `8:05`."
  zone:
    choose: "Выбери часовой пояс из списка или введи свой:"
    set:
      - "Часовой пояс: *{zone}*. Расписание пересчитано."
    invalid:
      - "Не знаю такого пояса. Примеры: `Europe/Moscow`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Напоминания *включены*. Буду писать по расписанию."
    "off": "Напоминания *выключены*. Включить снова можно кнопкой или командой /notify."
  answer:
    days_to: "До дня рождения осталось {days} {days|plural:one=день|few=дня|many=дней}. Поздравление придёт {date} в {time} по поясу {zone}."
    days_since: "Со дня рождения прошло {days} {days|plural:one=день|few=дня|many=дней}. Тебе {age} {age|plural:one=год|few=года|many=лет}."
    days_since_last: "С последнего дня рождения прошло {days} {days|plural:one=день|few=дня|many=дней}."
    no_year:
      - "В дате нет года, поэтому общий счёт дней со дня рождения невозможен. Счёт с последнего дня рождения работает и без года, кнопка ниже."
      - ""
      - "Возраст появится после даты с годом: /date"
    not_set: "Дата рождения ещё не указана. Начнём? /date"
  settings:
    view:
      - "*Твои настройки*"
      - ""
      - "Дата рождения: {date}"
      - "Время напоминания: {time}"
      - "Часовой пояс: {zone}"
      - "Напоминания: {notify}"
      - "Язык: {lang}"
    not_set: "не указана"
    "on": "Включены"
    "off": "Выключены"
  lang:
    choose: "Выбери язык:"
    set: "Язык переключён: {lang}"
  cancelled: "Отменил. Ни одной настройки не коснулся."
  reloaded: "Сообщения и клавиатуры перечитаны из YAML."
  perm:
    not: "Команда доступна только владельцу бота."

  delete:
    confirm:
      - "Удалить все твои данные (дату, настройки, историю напоминаний)?"
      - ""
      - "Действие необратимо: профиль и журнал доставки будут стёрты."
    done: "Данные удалены. Вернуться: /start"
  pointer:
    dm: "Ответил в личные сообщения"
  flood: "Слишком часто. Повтори через несколько секунд."
  about:
    - "У проекта *Birthday Bot* открытый исходный код."
    - ""
    - "Исходный код открыт на GitHub: {url}"
    - "Проект развиваю один и буду благодарен за звезду. Для меня это ещё и портфолио для поступления на IT Management."
    - ""
    - "Спасибо, что пользуешься."

reminder:
  countdown:
    - "До твоего дня рождения осталось {days} {days|plural:one=день|few=дня|many=дней}!"
    - ""
    - "Поздравление придёт {date} в {time} по поясу {zone}. Хорошего дня!"
  birthday:
    - "*С днём рождения!* Тебе исполняется {age} {age|plural:one=год|few=года|many=лет}."
    - ""
    - "Хорошего дня и отличного года."
  birthday.no_year:
    - "*С днём рождения!* Сегодня твой день."
    - ""
    - "Хорошего дня и отличного года."

