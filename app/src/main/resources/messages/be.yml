message:
  start:
    - "*Прывітанне!* Я сачу за днямі нараджэння і ніколі не прапускаю важныя даты."
    - ""
    - "Пакажы дату нараджэння, і я буду дасылаць адлік дзён і віншаванне дакладна ўчасна, у тваім часавым поясе і на тваёй мове."
  help:
    - "*Што я ўмею*"
    - ""
    - "/date: паказаць або змяніць дату нараджэння"
    - "/notify: уключыць або выключыць напаміны"
    - "/daysto: колькі дзён да дня нараджэння"
    - "/dayssince: колькі дзён ад дня нараджэння"
    - "/time: час напаміну"
    - "/zone: часавы пояс"
    - "/lang: мова"
    - "/settings: усе налады адразу"
    - ""
    - "Напаміны прыходзяць штодзень у абраны час, а ў сам дзень ты атрымліваеш віншаванне. Нічога не прапускаецца нават пасля перазапуску."
  prompt:
    date:
      - "Увядзі дату нараджэння ў любым зручным фармаце:"
      - ""
      - "`05.03.1998`, `05.03`, `5 сакавіка 1998`, `1998-03-05`"
      - ""
      - "Год паказваць неабавязкова, але без яго я не палічу ўзрост. Скасаванне: /cancel"
    time:
      - "Увядзі час напаміну, напрыклад `12:00` або `18`. Скасаванне: /cancel"
    zone:
      - "Увядзі часавы пояс, напрыклад `Europe/Minsk` або `UTC+3`. Скасаванне: /cancel"
  date:
    set:
      - "Захаваў дату: *{date}*"
      - ""
      - "Да дня нараджэння засталося {days} {days|plural:one=дзень|few=дні|many=дзён}. Напаміны будуць прыходзіць у {time} па поясе {zone}."
    invalid:
      - "Не змог разабраць дату. Прыклады: `05.03.1998`, `05.03`, `5 сакавіка 1998`, `1998-03-05`. Паспрабуй яшчэ раз."
    year_range: "Падобна на памылку ў годзе: {year}. Прымаю даты нараджэння з 1900 года па сёння ўключна."
  time:
    set:
      - "Час напаміну: *{time}* (па тваім поясе)"
    invalid:
      - "Не падобна на час. Прыклады: `12:00`, `18`, `8:05`."
  zone:
    choose: "Абяры часавы пояс са спісу або ўвядзі свой:"
    set:
      - "Часавы пояс: *{zone}*. Расклад пералічаны."
    invalid:
      - "Не ведаю такога пояса. Прыклады: `Europe/Minsk`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Напаміны *уключаны*. Пісацьму па раскладзе."
    "off": "Напаміны *выключаны*. Уключыць зноў можна кнопкай або камандай /notify."
  answer:
    days_to: "Да дня нараджэння засталося {days} {days|plural:one=дзень|few=дні|many=дзён}. Віншаванне прыйдзе {date} у {time} па поясе {zone}."
    days_since: "Ад дня нараджэння прайшло {days} {days|plural:one=дзень|few=дні|many=дзён}. Табе {age} {age|plural:one=год|few=гады|many=гадоў}."
    days_since_last: "Ад апошняга дня нараджэння прайшло {days} {days|plural:one=дзень|few=дні|many=дзён}."
    no_year:
      - "У даце няма года, таму агульную колькасць дзён ад нараджэння палічыць не магу. Лік ад апошняга дня нараджэння працуе і без года: гэта робіць кнопка ніжэй."
      - ""
      - "Дадай год, каб бачыць і ўзрост: /date"
    not_set: "Даты нараджэння яшчэ няма. Пачнем? /date"
  settings:
    view:
      - "*Твае налады*"
      - ""
      - "Дата нараджэння: {date}"
      - "Час напаміну: {time}"
      - "Часавы пояс: {zone}"
      - "Напаміны: {notify}"
      - "Мова: {lang}"
    not_set: "не паказана"
    "on": "Уключаны"
    "off": "Выключаны"
  lang:
    choose: "Абяры мову:"
    set: "Мова пераключана: {lang}"
  cancelled: "Скасавана. Ніводнай налады не крануў."
  reloaded: "Паведамленні і клавіятуры перачытаны з YAML."
  perm:
    not: "Каманда даступная толькі ўладальніку бота."

  delete:
    confirm:
      - "Выдаліць усе твае даныя (дату, налады, гісторыю напамінаў)?"
      - ""
      - "Гэта незваротна: профіль і часопіс даставак будуць сцёртыя."
    done: "Даныя выдалены. Вяртайся праз /start"
  pointer:
    dm: "Адказаў у асабістыя паведамленні"
  flood: "Зачаста. Паўтары праз некалькі секунд."
  about:
    - "Праект *Birthday Bot* мае адкрыты зыходны код."
    - ""
    - "Зыходны код адкрыты на GitHub: {url}"
    - "Я развіваю праект сам і буду ўдзячны за зорачку. Гэта яшчэ і маё партфоліо для паступлення на IT Management."
    - ""
    - "Дзякуй, што карыстаешся."

reminder:
  countdown:
    - "Да твайго дня нараджэння засталося {days} {days|plural:one=дзень|few=дні|many=дзён}!"
    - ""
    - "Віншаванне прыйдзе {date} у {time} па поясе {zone}. Добрага дня!"
  birthday:
    - "*З днём нараджэння!* Табе споўніцца {age} {age|plural:one=год|few=гады|many=гадоў}."
    - ""
    - "Добрага дня і цудоўнага года."
  birthday.no_year:
    - "*З днём нараджэння!* Сёння твой дзень."
    - ""
    - "Добрага дня і цудоўнага года."

