message:
  start:
    - "*Здравей!* Аз следя рождените дни и никога не пропускам важна дата."
    - ""
    - "Задай датата си на раждане и ще изпращам отброяването и поздравлението точно навреме, в твоя часова зона и на твоя език."
  help:
    - "*Какво умея*"
    - ""
    - "/date: задай или промени датата на раждане"
    - "/notify: включи или изключи напомнянията"
    - "/daysto: дни до рождения ден"
    - "/dayssince: дни от рождения ден"
    - "/time: час за напомняне"
    - "/zone: часова зона"
    - "/lang: език"
    - "/settings: всички настройки наведнъж"
    - ""
    - "Напомнянията пристигат всеки ден в избрания час, а в самия ден получаваш поздравление. Нищо не се пропуска, дори след рестарт."
  prompt:
    date:
      - "Въведи датата на раждане в удобен формат:"
      - ""
      - "`05.03.1998`, `05.03`, `5 март 1998`, `1998-03-05`"
      - ""
      - "Годината не е задължителна, но без нея не мога да изчисля възрастта. Отказ: /cancel"
    time:
      - "Въведи час за напомняне, например `12:00` или `18`. Отказ: /cancel"
    zone:
      - "Въведи часова зона, например `Europe/Sofia` или `UTC+3`. Отказ: /cancel"
  date:
    set:
      - "Запазих: *{date}*"
      - ""
      - "Остават {days} {days|plural:one=ден|other=дни} до рождения ден. Напомнянията ще пристигат в {time} в твоя часова зона: {zone}."
    invalid:
      - "Не разбрах датата. Примери: `05.03.1998`, `05.03`, `5 март 1998`, `1998-03-05`. Опитай пак."
    year_range: "Тази година прилича на грешка при писане: {year}. Приемам дати на раждане от 1900 до днес включително."
  time:
    set:
      - "Час за напомняне: *{time}* (твоето локално време)"
    invalid:
      - "Това не прилича на час. Примери: `12:00`, `18`, `8:05`."
  zone:
    choose: "Избери часовата си зона от списъка или въведи своя:"
    set:
      - "Часова зона: *{zone}*. Графикът е преизчислен."
    invalid:
      - "Не познавам такава зона. Примери: `Europe/Sofia`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Напомнянията са *включени*. Ще пиша по график."
    "off": "Напомнянията са *изключени*. Върни ги с бутона или с /notify."
  answer:
    days_to: "Остават {days} {days|plural:one=ден|other=дни} до рождения ден. Поздравлението пристига на {date} в {time} в твоя часова зона: {zone}."
    days_since: "Изминаха {days} {days|plural:one=ден|other=дни} от раждането. Ти си на {age} {age|plural:one=година|other=години}."
    days_since_last: "Изминаха {days} {days|plural:one=ден|other=дни} от последния ти рожден ден."
    no_year:
      - "Датата няма година, затова общият брой дни от раждането е невъзможен. Броенето от последния рожден ден работи и без година: бутонът по-долу го прави."
      - ""
      - "Добави година, за да виждаш и възрастта: /date"
    not_set: "Все още няма дата на раждане. Да започваме ли? /date"
  settings:
    view:
      - "*Твоите настройки*"
      - ""
      - "Дата на раждане: {date}"
      - "Час за напомняне: {time}"
      - "Часова зона: {zone}"
      - "Напомняния: {notify}"
      - "Език: {lang}"
    not_set: "не е зададено"
    "on": "Включени"
    "off": "Изключени"
  lang:
    choose: "Избери език:"
    set: "Езикът е сменен: {lang}"
  cancelled: "Отменено. Не промених никакви настройки."
  reloaded: "Съобщенията и клавиатурите са презаредени от YAML."
  perm:
    not: "Тази команда е само за собственика."

  delete:
    confirm:
      - "Да изтрия ли всички твои данни (дата, настройки, история на напомнянията)?"
      - ""
      - "Действието е необратимо: профилът и журналът за доставки ще бъдат изтрити."
    done: "Данните са изтрити. Върни се чрез /start"
  pointer:
    dm: "Отговорих в лични съобщения"
  flood: "Твърде бързо. Опитай след няколко секунди."
  about:
    - "*Birthday Bot* се разработва открито: изходният код е публичен."
    - ""
    - "Изходният код е в GitHub: {url}"
    - "Развивам проекта сам и ще се радвам на звезда. Той ми е и портфолио за кандидатстване в IT Management."
    - ""
    - "Благодаря, че ползваш бота."

reminder:
  countdown:
    - "Остават {days} {days|plural:one=ден|other=дни} до рождения ти ден!"
    - ""
    - "Поздравлението пристига на {date} в {time} в твоя часова зона: {zone}. Хубав ден!"
  birthday:
    - "*Честит рожден ден!* Ставаш на {age} {age|plural:one=година|other=години}."
    - ""
    - "Хубав ден и чудесна година."
  birthday.no_year:
    - "*Честит рожден ден!* Днес е твоят ден."
    - ""
    - "Хубав ден и чудесна година."

