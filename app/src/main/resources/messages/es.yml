message:
  start:
    - "*¡Hola!* Yo vigilo los cumpleaños y nunca dejo pasar una fecha importante."
    - ""
    - "Indica tu fecha de nacimiento, y te enviaré la cuenta regresiva y la felicitación puntualmente, en tu zona horaria y en tu idioma."
  help:
    - "*Qué sé hacer*"
    - ""
    - "/date: indicar o cambiar la fecha de nacimiento"
    - "/notify: activar o desactivar los recordatorios"
    - "/daysto: días hasta tu cumpleaños"
    - "/dayssince: días desde tu nacimiento"
    - "/time: hora del recordatorio"
    - "/zone: zona horaria"
    - "/lang: idioma"
    - "/settings: todos los ajustes a la vez"
    - ""
    - "Los recordatorios llegan a diario a la hora elegida, y el mismo día recibes una felicitación. No se pierde nada, ni tras un reinicio."
  prompt:
    date:
      - "Escribe tu fecha de nacimiento en cualquier formato:"
      - ""
      - "`05.03.1998`, `05.03`, `5 de marzo de 1998`, `1998-03-05`"
      - ""
      - "El año es opcional, pero sin él no puedo calcular tu edad. Cancelar: /cancel"
    time:
      - "Escribe la hora del recordatorio, p. ej. `12:00` o `18`. Cancelar: /cancel"
    zone:
      - "Escribe tu zona horaria, p. ej. `Europe/Madrid` o `UTC+3`. Cancelar: /cancel"
  date:
    set:
      - "Guardado: *{date}*"
      - ""
      - "Quedan {days} {days|plural:one=día|other=días} hasta tu cumpleaños. Los recordatorios llegarán a las {time} en tu zona horaria: {zone}."
    invalid:
      - "No pude leer la fecha. Ejemplos: `05.03.1998`, `05.03`, `5 de marzo de 1998`, `1998-03-05`. Inténtalo de nuevo."
    year_range: "Ese año parece una errata: {year}. Acepto fechas de nacimiento desde 1900 hasta hoy incluido."
  time:
    set:
      - "Hora del recordatorio: *{time}* (tu hora local)"
    invalid:
      - "Eso no parece una hora. Ejemplos: `12:00`, `18`, `8:05`."
  zone:
    choose: "Elige tu zona horaria de la lista o escribe la tuya:"
    set:
      - "Zona horaria: *{zone}*. Horario recalculado."
    invalid:
      - "Zona horaria desconocida. Ejemplos: `Europe/Madrid`, `UTC+3`, `America/Mexico_City`."
  notify:
    "on": "Recordatorios *activados*. Escribiré según el horario."
    "off": "Recordatorios *desactivados*. Vuelve a activarlos con el botón o /notify."
  answer:
    days_to: "Quedan {days} {days|plural:one=día|other=días} hasta tu cumpleaños. La felicitación llegará el {date} a las {time} en tu zona horaria: {zone}."
    days_since: "Han pasado {days} {days|plural:one=día|other=días} desde tu nacimiento. Tienes {age} {age|plural:one=año|other=años}."
    days_since_last: "Han pasado {days} {days|plural:one=día|other=días} desde tu último cumpleaños."
    no_year:
      - "La fecha no tiene año, así que no puedo contar el total de días desde tu nacimiento. Contar desde el último cumpleaños funciona sin año: el botón de abajo lo hace."
      - ""
      - "Indica la fecha con año para ver también tu edad: /date"
    not_set: "Aún no hay fecha de nacimiento. ¿Empezamos? /date"
  settings:
    view:
      - "*Tus ajustes*"
      - ""
      - "Fecha de nacimiento: {date}"
      - "Hora del recordatorio: {time}"
      - "Zona horaria: {zone}"
      - "Recordatorios: {notify}"
      - "Idioma: {lang}"
    not_set: "sin indicar"
    "on": "Activados"
    "off": "Desactivados"
  lang:
    choose: "Elige tu idioma:"
    set: "Idioma cambiado: {lang}"
  cancelled: "Cancelado. No toqué ningún ajuste."
  reloaded: "Mensajes y teclados recargados desde YAML."
  perm:
    not: "Este comando es solo para el propietario."

  delete:
    confirm:
      - "¿Eliminar todos tus datos (fecha, ajustes, historial de recordatorios)?"
      - ""
      - "Es irreversible: se borrarán el perfil y el registro de envíos."
    done: "Datos eliminados. Vuelve con /start"
  pointer:
    dm: "Respondí en mensajes directos"
  flood: "Demasiado rápido. Inténtalo en unos segundos."
  about:
    - "*Birthday Bot* se desarrolla a la vista de todos: su código fuente es público."
    - ""
    - "El código fuente está en GitHub: {url}"
    - "Desarrollo el proyecto yo solo y agradezco una estrella. También es mi portafolio para acceder a IT Management."
    - ""
    - "Gracias por usarlo."

reminder:
  countdown:
    - "¡Quedan {days} {days|plural:one=día|other=días} hasta tu cumpleaños!"
    - ""
    - "La felicitación llegará el {date} a las {time} en tu zona horaria: {zone}. ¡Que tengas un buen día!"
  birthday:
    - "*¡Feliz cumpleaños!* Cumples {age} {age|plural:one=año|other=años}."
    - ""
    - "Que tengas un buen día y un buen año."
  birthday.no_year:
    - "*¡Feliz cumpleaños!* Hoy es tu día."
    - ""
    - "Que tengas un buen día y un buen año."

