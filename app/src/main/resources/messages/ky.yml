message:
  start:
    - "*Салам!* Мен туулган күндөрдү көзөмөлдөйм жана маанилүү датаны эч качан өткөрүп жибербейм."
    - ""
    - "Туулган күнүңдү көрсөт, мен санакты жана куттуктоону дал убагында, сенин убакыт алкагыңда жана сенин тилиңде жөнөтөм."
  help:
    - "*Мен эмнени билем*"
    - ""
    - "/date: туулган күндү көрсөтүү же өзгөртүү"
    - "/notify: эскертүүлөрдү күйгүзүү же өчүрүү"
    - "/daysto: туулган күнгө чейинки күндөр"
    - "/dayssince: туулган күндөн бери өткөн күндөр"
    - "/time: эскертүүнүн убактысы"
    - "/zone: убакыт алкагы"
    - "/lang: тил"
    - "/settings: бардык жөндөөлөр бирден"
    - ""
    - "Эскертүүлөр тандалган убакытта күн сайын келет, ал эми ошол күндүн өзүндө куттуктоо аласың. Кайра жүргүзүүдөн кийин да эч нерсе жоголбойт."
  prompt:
    date:
      - "Туулган күнүңдү ыңгайлуу форматта киргиз:"
      - ""
      - "`05.03.1998`, `05.03`, `5-март 1998`, `1998-03-05`"
      - ""
      - "Жылды көрсөтүү милдеттүү эмес, бирок ансыз жашыңды эсептей албайм. Жокко чыгаруу: /cancel"
    time:
      - "Эскертүүнүн убактысын киргиз, мисалы `12:00` же `18`. Жокко чыгаруу: /cancel"
    zone:
      - "Убакыт алкагын киргиз, мисалы `Asia/Bishkek` же `UTC+3`. Жокко чыгаруу: /cancel"
  date:
    set:
      - "Сакталды: *{date}*"
      - ""
      - "Туулган күнгө чейин {days} {days|plural:one=күн|other=күн} калды. Эскертүүлөр {time} убактысында, {zone} алкагында келет."
    invalid:
      - "Датаны окуй алган жокмун. Мисалдар: `05.03.1998`, `05.03`, `5-март 1998`, `1998-03-05`. Дагы бир жолу көр."
    year_range: "Бул жыл катага окшош: {year}. Туулган күндөрдү 1900-жылдан бүгүнгө чейин кабыл алам."
  time:
    set:
      - "Эскертүүнүн убактысы: *{time}* (сенин жергиликтүү убактың)"
    invalid:
      - "Бул убакытка окшошпойт. Мисалдар: `12:00`, `18`, `8:05`."
  zone:
    choose: "Тизмеден алкагыңды танда же өзүңдүкүн киргиз:"
    set:
      - "Убакыт алкагы: *{zone}*. Тартип кайра эсептелди."
    invalid:
      - "Мындай алкакты билбейм. Мисалдар: `Asia/Bishkek`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Эскертүүлөр *күйүк*. Тартип боюнча жазам."
    "off": "Эскертүүлөр *өчүк*. Баскыч же /notify аркылуу кайра күйгүз."
  answer:
    days_to: "Туулган күнгө чейин {days} {days|plural:one=күн|other=күн} калды. Куттуктоо {date} күнү {time} убактысында, {zone} алкагында келет."
    days_since: "Туулган күндөн бери {days} {days|plural:one=күн|other=күн} өттү. Сен {age} {age|plural:one=жаш|other=жаш}тасың."
    days_since_last: "Акыркы туулган күндөн бери {days} {days|plural:one=күн|other=күн} өттү."
    no_year:
      - "Датада жыл жок, ошондуктан туулган күндөн бери бардык күндү эсептей албайм. Акыркы туулган күндөн санау жылсыз да иштейт: төмөнкү баскыч ошону жасайт."
      - ""
      - "Жашыңды да көрүү үчүн жылды кош: /date"
    not_set: "Туулган күн азырынча көрсөтүлгөн эмес. Баштайлыбы? /date"
  settings:
    view:
      - "*Сенин жөндөөлөрүң*"
      - ""
      - "Туулган күн: {date}"
      - "Эскертүүнүн убактысы: {time}"
      - "Убакыт алкагы: {zone}"
      - "Эскертүүлөр: {notify}"
      - "Тил: {lang}"
    not_set: "көрсөтүлгөн эмес"
    "on": "Күйүк"
    "off": "Өчүк"
  lang:
    choose: "Тилди танда:"
    set: "Тил алмаштырылды: {lang}"
  cancelled: "Жокко чыгарылды. Эч бир жөндөө өзгөргөн жок."
  reloaded: "Билдирүүлөр жана клавиатуралар YAML-ден кайра окулду."
  perm:
    not: "Бул команда боттун ээсине гана."

  delete:
    confirm:
      - "Бардык маалыматыңды (күн, жөндөөлөр, эскертүү тарыхы) өчүрүү керекпи?"
      - ""
      - "Бул кайтарылгыс: профиль жана жеткирүү журналы өчүрүлөт."
    done: "Маалымат өчүрүлдү. /start аркылуу кайт."
  pointer:
    dm: "Жеке билдирүүлөргө жооп бердим"
  flood: "Өтө тез. Бир нече секунддан кийин кайтала."
  about:
    - "*Birthday Bot* ачык иштелет: баштапкы код жалпыга ачык."
    - ""
    - "Баштапкы код GitHub-та: {url}"
    - "Долбоорду жалгыз өнүктүрөм жана жылдызча үчүн ыраазы болмокмун. Бул ошондой эле IT Management-ке өтүү үчүн портфолиом."
    - ""
    - "Колдонгонуң үчүн рахмат."

reminder:
  countdown:
    - "Туулган күнүңө чейин {days} {days|plural:one=күн|other=күн} калды!"
    - ""
    - "Куттуктоо {date} күнү {time} убактысында, {zone} алкагында келет. Жакшы күн болсун!"
  birthday:
    - "*Туулган күнүң менен!* Сен {age} {age|plural:one=жаш|other=жаш} толдуң."
    - ""
    - "Жакшы күн жана мыкты жыл болсун."
  birthday.no_year:
    - "*Туулган күнүң менен!* Бүгүн сенин күнүң."
    - ""
    - "Жакшы күн жана мыкты жыл болсун."

