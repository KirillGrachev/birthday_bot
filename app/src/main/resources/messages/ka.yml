message:
  start:
    - "*გამარჯობა!* მე ვადევნებ თვალს დაბადების დღეებს და არასდროს ვუშვებ მნიშვნელოვან თარიღს."
    - ""
    - "მიუთითე შენი დაბადების თარიღი და მე გამოგზავნი დღეთა ათვლასა და მილოცვას ზუსტად დროულად, შენს დროის სარტყელში და შენს ენაზე."
  help:
    - "*რა შემიძლია*"
    - ""
    - "/date: დააყენე ან შეცვალე დაბადების თარიღი"
    - "/notify: შენიშვნების ჩართვა ან გამორთვა"
    - "/daysto: დღეები დაბადების დღემდე"
    - "/dayssince: დღეები დაბადებიდან"
    - "/time: შენიშვნის დრო"
    - "/zone: დროის სარტყელი"
    - "/lang: ენა"
    - "/settings: ყველა პარამეტრი ერთად"
    - ""
    - "შენიშვნები მოდის ყოველდღე არჩეულ დროს, ხოლო თავად დღეს იღებ მილოცვას. არაფერი იკარგება გადატვირთვის შემდეგაც."
  prompt:
    date:
      - "შეიყვანე დაბადების თარიღი ნებისმიერ ფორმატში:"
      - ""
      - "`05.03.1998`, `05.03`, `5 მარტი 1998`, `1998-03-05`"
      - ""
      - "წელი სურვილისამებრია, მაგრამ მის გარეშე ვერ დავთვლი ასაკს. გაუქმება: /cancel"
    time:
      - "შეიყვანე შენიშვნის დრო, მაგ. `12:00` ან `18`. გაუქმება: /cancel"
    zone:
      - "შეიყვანე დროის სარტყელი, მაგ. `Asia/Tbilisi` ან `UTC+3`. გაუქმება: /cancel"
  date:
    set:
      - "შენახულია: *{date}*"
      - ""
      - "დაბადების დღემდე დარჩა {days} {days|plural:one=დღე|other=დღე}. შენიშვნები მოვა {time} საათზე შენს სარტყელში {zone}."
    invalid:
      - "თარიღი ვერ წავიკითხე. მაგალითები: `05.03.1998`, `05.03`, `5 მარტი 1998`, `1998-03-05`. სცადე კიდევ."
    year_range: "ეს წელიწადი ბეჭდურ შეცდომას ჰგავს: {year}. ვიღებ დაბადების თარიღებს 1900-დან დღემდე ჩათვლით."
  time:
    set:
      - "შენიშვნის დრო: *{time}* (შენი ადგილობრივი დრო)"
    invalid:
      - "ეს დროს არ ჰგავს. მაგალითები: `12:00`, `18`, `8:05`."
  zone:
    choose: "აირჩიე სარტყელი სიიდან ან შეიყვანე საკუთარი:"
    set:
      - "დროის სარტყელი: *{zone}*. განრიგი გადაითვალა."
    invalid:
      - "ასეთ სარტყელს არ ვიცნობ. მაგალითები: `Asia/Tbilisi`, `UTC+3`, `America/New_York`."
  notify:
    "on": "შენიშვნები *ჩართულია*. დავწერ განრიგის მიხედვით."
    "off": "შენიშვნები *გამორთულია*. ისევ ჩართე ღილაკით ან /notify-ით."
  answer:
    days_to: "დაბადების დღემდე დარჩა {days} {days|plural:one=დღე|other=დღე}. მილოცვა მოვა {date} {time} საათზე შენს სარტყელში {zone}."
    days_since: "დაბადებიდან გავიდა {days} {days|plural:one=დღე|other=დღე}. შენ ხარ {age} {age|plural:one=წლის|other=წლის}."
    days_since_last: "ბოლო დაბადების დღიდან გავიდა {days} {days|plural:one=დღე|other=დღე}."
    no_year:
      - "თარიღში წელი არ არის, ამიტომ დაბადებიდან დღეების ჯამური რაოდენობა არ ითვლება. ბოლო დაბადების დღიდან ათვლა წლის გარეშეც მუშაობს: ქვემოთ ღილაკი ამას აკეთებს."
      - ""
      - "დაამატე წელი, რომ ასაკიც დაინახო: /date"
    not_set: "დაბადების თარიღი ჯერ არ არის. დავიწყოთ? /date"
  settings:
    view:
      - "*შენი პარამეტრები*"
      - ""
      - "დაბადების თარიღი: {date}"
      - "შენიშვნის დრო: {time}"
      - "დროის სარტყელი: {zone}"
      - "შენიშვნები: {notify}"
      - "ენა: {lang}"
    not_set: "მითითებული არ არის"
    "on": "Ჩართული"
    "off": "Გამორთული"
  lang:
    choose: "აირჩიე ენა:"
    set: "ენა გადართულია: {lang}"
  cancelled: "გაუქმდა. არცერთი პარამეტრი შეცვლილა."
  reloaded: "შეტყობინებები და კლავიატურები თავიდან წაიკითხა YAML-დან."
  perm:
    not: "ეს ბრძანება მხოლოდ ბოტის მფლობელისთვის არის."

  delete:
    confirm:
      - "წავშალო შენი მონაცემები (თარიღი, პარამეტრები, შენიშვნების ისტორია)?"
      - ""
      - "ეს შეუქცევადია: პროფილი და მიწოდების ჟურნალი წაიშლება."
    done: "მონაცემები წაშლილია. დაბრუნდი /start-ით"
  pointer:
    dm: "ვუპასუხე პირად შეტყобინებებში"
  flood: "ძალიან სწრაფად. სცადე რამდენიმე წამში."
  about:
    - "*Birthday Bot* ვითარდება ღიად: საწყისი კოდი საჯაროა."
    - ""
    - "საწყისი კოდი არის GitHub-ზე: {url}"
    - "პროექტს მარტო ვავითარებ და მადლობელი ვიქნები ვარსკვლავისთვის. ეს ასევე ჩემი პორტფოლიოა IT Management-ში ჩასარიცხად."
    - ""
    - "მადლობა, რომ იყენებ."

reminder:
  countdown:
    - "შენ დაბადების დღემდე დარჩა {days} {days|plural:one=დღე|other=დღე}!"
    - ""
    - "მილოცვა მოვა {date} {time} საათზე შენს სარტყელში {zone}. კარგი დღე!"
  birthday:
    - "*გილოცავ დაბადების დღეს!* შესრულდი {age} {age|plural:one=წლის|other=წლის}."
    - ""
    - "კარგი დღე და შესანიშნავი წელი."
  birthday.no_year:
    - "*გილოცავ დაბადების დღეს!* დღეს შენი დღეა."
    - ""
    - "კარგი დღე და შესანიშნავი წელი."

