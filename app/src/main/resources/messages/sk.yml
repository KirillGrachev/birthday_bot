message:
  start:
    - "*Ahoj!* Strážim narodeniny a nikdy nezmeškám dôležitý dátum."
    - ""
    - "Nastav si dátum narodenia a ja budem posielať odpočítavanie a blahoželanie presne na čas, v tvojom časovom pásme a v tvojom jazyku."
  help:
    - "*Čo viem*"
    - ""
    - "/date: nastaviť alebo zmeniť dátum narodenia"
    - "/notify: zapnúť alebo vypnúť pripomienky"
    - "/daysto: dni do narodenín"
    - "/dayssince: dni od narodenia"
    - "/time: čas pripomienky"
    - "/zone: časové pásmo"
    - "/lang: jazyk"
    - "/settings: všetky nastavenia naraz"
    - ""
    - "Pripomienky chodia denne vo zvolený čas a v samotný deň dostaneš blahoželanie. Nič sa nestratí, ani po reštarte."
  prompt:
    date:
      - "Zadaj dátum narodenia v ľubovoľnom formáte:"
      - ""
      - "`05.03.1998`, `05.03`, `5. marca 1998`, `1998-03-05`"
      - ""
      - "Rok je voliteľný, ale bez niego nevypočítam vek. Zrušenie: /cancel"
    time:
      - "Zadaj čas pripomienky, napríklad `12:00` alebo `18`. Zrušenie: /cancel"
    zone:
      - "Zadaj časové pásmo, napríklad `Europe/Bratislava` alebo `UTC+3`. Zrušenie: /cancel"
  date:
    set:
      - "Uložené: *{date}*"
      - ""
      - "Do narodenín zostáva {days} {days|plural:one=deň|few=dni|many=dní}. Pripomienky budú chodiť o {time} v tvojom pásme {zone}."
    invalid:
      - "Dátum som nevedel prečítať. Príklady: `05.03.1998`, `05.03`, `5. marca 1998`, `1998-03-05`. Skús znova."
    year_range: "Tento rok vyzerá ako preklep: {year}. Prijímam dátumy narodenia od 1900 po dnešok vrátane."
  time:
    set:
      - "Čas pripomienky: *{time}* (tvoj miestny čas)"
    invalid:
      - "Toto nevyzerá ako čas. Príklady: `12:00`, `18`, `8:05`."
  zone:
    choose: "Vyber si pásmo zo zoznamu, alebo napíš vlastné:"
    set:
      - "Časové pásmo: *{zone}*. Rozvrh prepočítaný."
    invalid:
      - "Také pásmo nepoznám. Príklady: `Europe/Bratislava`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Pripomienky sú *zapnuté*. Budem písať podľa rozvrhu."
    "off": "Pripomienky sú *vypnuté*. Zapni ich znova tlačidlom alebo príkazom /notify."
  answer:
    days_to: "Do narodenín zostáva {days} {days|plural:one=deň|few=dni|many=dní}. Blahoželanie príde {date} o {time} v tvojom pásme {zone}."
    days_since: "Od narodenia uplynulo {days} {days|plural:one=deň|few=dni|many=dní}. Máš {age} {age|plural:one=rok|few=roky|many=rokov}."
    days_since_last: "Od posledných narodenín uplynulo {days} {days|plural:one=deň|few=dni|many=dní}."
    no_year:
      - "Dátum nemá rok, takže celkový počet dní od narodenia sa nedá spočítať. Počítanie od posledných narodenín funguje aj bez roka: tlačidlo nižšie to urobí."
      - ""
      - "Pridaj rok a uvidíš aj vek: /date"
    not_set: "Dátum narodenia zatiaľ nie je zadaný. Začíname? /date"
  settings:
    view:
      - "*Tvoje nastavenia*"
      - ""
      - "Dátum narodenia: {date}"
      - "Čas pripomienky: {time}"
      - "Časové pásmo: {zone}"
      - "Pripomienky: {notify}"
      - "Jazyk: {lang}"
    not_set: "nenastavené"
    "on": "Zapnuté"
    "off": "Vypnuté"
  lang:
    choose: "Vyber jazyk:"
    set: "Jazyk prepnutý: {lang}"
  cancelled: "Zrušené. Žiadneho nastavenia som sa nedotkol."
  reloaded: "Správy a klávesnice znova načítané z YAML."
  perm:
    not: "Tento príkaz je len pre vlastníka."

  delete:
    confirm:
      - "Zmazať všetky tvoje údaje (dátum, nastavenia, históriu pripomienok)?"
      - ""
      - "Je to nevratné: profil a denník doručenia budú vymazané."
    done: "Údaje zmazané. Vráť sa cez /start"
  pointer:
    dm: "Odpovedal som v priamych správach"
  flood: "Príliš rýchlo. Skús o pár sekúnd."
  about:
    - "*Birthday Bot* vzniká otvorene: zdrojový kód je verejný."
    - ""
    - "Zdrojový kód je na GitHube: {url}"
    - "Projekt vyvíjam sám a budem vďačný za hviezdičku. Je to aj moje portfólio pre prihlášku na IT Management."
    - ""
    - "Ďakujem, že to používaš."

reminder:
  countdown:
    - "Do tvojich narodenín zostáva {days} {days|plural:one=deň|few=dni|many=dní}!"
    - ""
    - "Blahoželanie príde {date} o {time} v tvojom pásme {zone}. Pekný deň!"
  birthday:
    - "*Všetko najlepšie k narodeninám!* Máš {age} {age|plural:one=rok|few=roky|many=rokov}."
    - ""
    - "Pekný deň a skvelý rok."
  birthday.no_year:
    - "*Všetko najlepšie k narodeninám!* Dnes je tvoj deň."
    - ""
    - "Pekný deň a skvelý rok."

