message:
  start:
    - "*Labas!* Aš seku gimtadienius ir niekada nepraleidžiu svarbios datos."
    - ""
    - "Nurodyk savo gimimo datą, ir aš atsiųsiu dienų skaičiavimą bei sveikinimą lygiai laiku, tavo laiko juostoje ir tavo kalba."
  help:
    - "*Ką aš moku*"
    - ""
    - "/date: nustatyk arba pakeisk gimimo datą"
    - "/notify: įjunk arba išjunk priminimus"
    - "/daysto: kiek dienų iki gimtadienio"
    - "/dayssince: kiek dienų nuo gimimo"
    - "/time: priminimo laikas"
    - "/zone: laiko juosta"
    - "/lang: kalba"
    - "/settings: visi nustatymai iš karto"
    - ""
    - "Priminimai atkeliauja kasdien pasirinktą valandą, o pačią dieną gauni sveikinimą. Nieko nepraleidžiama net po perkrovimo."
  prompt:
    date:
      - "Įvesk gimimo datą bet kokiu patogiu formatu:"
      - ""
      - "`05.03.1998`, `05.03`, `1998 m. kovo 5 d.`, `1998-03-05`"
      - ""
      - "Metai nebūtini, bet be jų nesuskaičiuosiu amžiaus. Atšaukti: /cancel"
    time:
      - "Įvesk priminimo laiką, pvz. `12:00` arba `18`. Atšaukti: /cancel"
    zone:
      - "Įvesk laiko juostą, pvz. `Europe/Vilnius` arba `UTC+3`. Atšaukti: /cancel"
  date:
    set:
      - "Išsaugota: *{date}*"
      - ""
      - "Iki gimtadienio liko {days} {days|plural:one=diena|few=dienos|other=dienų}. Priminimai atkeliaus {time} tavo juostoje {zone}."
    invalid:
      - "Neperskaičiau datos. Pavyzdžiai: `05.03.1998`, `05.03`, `1998 m. kovo 5 d.`, `1998-03-05`. Bandyk dar kartą."
    year_range: "Metai panašūs į rašymo klaidą: {year}. Priimu gimimo datas nuo 1900 iki šiandien imtinai."
  time:
    set:
      - "Priminimo laikas: *{time}* (tavo vietiniu laiku)"
    invalid:
      - "Tai nepanašu į laiką. Pavyzdžiai: `12:00`, `18`, `8:05`."
  zone:
    choose: "Pasirink juostą iš sąrašo arba įvesk savo:"
    set:
      - "Laiko juosta: *{zone}*. Tvarkaraštis perskaičiuotas."
    invalid:
      - "Tokios juostos nežinau. Pavyzdžiai: `Europe/Vilnius`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Priminimai *įjungti*. Rašysiu pagal tvarkaraštį."
    "off": "Priminimai *išjungti*. Įjunk iš naujo mygtuku arba komanda /notify."
  answer:
    days_to: "Iki gimtadienio liko {days} {days|plural:one=diena|few=dienos|other=dienų}. Sveikinimas atkeliaus {date} {time} tavo juostoje {zone}."
    days_since: "Nuo gimimo praėjo {days} {days|plural:one=diena|few=dienos|other=dienų}. Tau {age} {age|plural:one=metai|few=metai|other=metų}."
    days_since_last: "Nuo paskutinio gimtadienio praėjo {days} {days|plural:one=diena|few=dienos|other=dienų}."
    no_year:
      - "Datoje nėra metų, todėl bendro dienų nuo gimimo skaičiaus suskaičiuoti negaliu. Skaičiavimas nuo paskutinio gimtadienio veikia ir be metų: tai padaro mygtukas žemiau."
      - ""
      - "Pridėk metus, kad matytum ir amžių: /date"
    not_set: "Gimimo datos dar nėra. Pradedam? /date"
  settings:
    view:
      - "*Tavo nustatymai*"
      - ""
      - "Gimimo data: {date}"
      - "Priminimo laikas: {time}"
      - "Laiko juosta: {zone}"
      - "Priminimai: {notify}"
      - "Kalba: {lang}"
    not_set: "nenustatyta"
    "on": "Įjungti"
    "off": "Išjungti"
  lang:
    choose: "Pasirink kalbą:"
    set: "Kalba perjungta: {lang}"
  cancelled: "Atšaukta. Nė vienas nustatymas nepakeistas."
  reloaded: "Žinutės ir klaviatūros iš naujo perskaitytos iš YAML."
  perm:
    not: "Ši komanda skirta tik savininkui."

  delete:
    confirm:
      - "Ištrinti visus tavo duomenis (datą, nustatymus, priminimų istoriją)?"
      - ""
      - "Tai negrįžtama: profilis ir pristatymo žurnalas bus ištrinti."
    done: "Duomenys ištrinti. Grįžk per /start"
  pointer:
    dm: "Atsakiau asmeninėse žinutėse"
  flood: "Per greitai. Pabandyk po kelių sekundžių."
  about:
    - "*Birthday Bot* kuriamas atvirai: pirminis kodas viešas."
    - ""
    - "Pirminis kodas yra GitHub: {url}"
    - "Projektą kuriu vienas ir būčiau dėkingas už žvaigždutę. Tai ir mano portfolijas stojant į IT Management."
    - ""
    - "Ačiū, kad naudoji."

reminder:
  countdown:
    - "Iki tavo gimtadienio liko {days} {days|plural:one=diena|few=dienos|other=dienų}!"
    - ""
    - "Sveikinimas atkeliaus {date} {time} tavo juostoje {zone}. Geros dienos!"
  birthday:
    - "*Su gimtadieniu!* Tau sukanka {age} {age|plural:one=metai|few=metai|other=metų}."
    - ""
    - "Geros dienos ir puikių metų."
  birthday.no_year:
    - "*Su gimtadieniu!* Šiandien tavo diena."
    - ""
    - "Geros dienos ir puikių metų."

