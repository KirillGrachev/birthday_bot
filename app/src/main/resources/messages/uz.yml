message:
  start:
    - "*Salom!* Men tug'ilgan kunlarni kuzataman va muhim sanalarni hech qachon o'tkazib yubormayman."
    - ""
    - "Tug'ilgan sanangni ko'rsat, men sanokni va tabrikni ayni vaqtida, o'z vaqt mintaqangda va o'z tilingda yuboraman."
  help:
    - "*Nimalarni bilaman*"
    - ""
    - "/date: tug'ilgan sanani ko'rsatish yoki o'zgartirish"
    - "/notify: eslatmalarni yoqish yoki o'chirish"
    - "/daysto: tug'ilgan kunga qolgan kunlar"
    - "/dayssince: tug'ilgan kundan o'tgan kunlar"
    - "/time: eslatma vaqti"
    - "/zone: vaqt mintaqasi"
    - "/lang: til"
    - "/settings: barcha sozlamalar birdaniga"
    - ""
    - "Eslatmalar har kuni tanlangan vaqtda keladi, ayni kunda esa tabrik olasiz. Qayta ishga tushirishdan keyin ham hech narsa yo'qolmaydi."
  prompt:
    date:
      - "Tug'ilgan sanangni qulay formatda kiriting:"
      - ""
      - "`05.03.1998`, `05.03`, `5-mart, 1998`, `1998-03-05`"
      - ""
      - "Yil ixtiyoriy, lekin u bo'lmasa yoshingizni hisoblay olmayman. Bekor qilish: /cancel"
    time:
      - "Eslatma vaqtini kiriting, masalan `12:00` yoki `18`. Bekor qilish: /cancel"
    zone:
      - "Vaqt mintaqasini kiriting, masalan `Asia/Tashkent` yoki `UTC+3`. Bekor qilish: /cancel"
  date:
    set:
      - "Saqlandi: *{date}*"
      - ""
      - "Tug'ilgan kunga {days} {days|plural:one=kun|other=kun} qoldi. Eslatmalar {time} vaqtida {zone} mintaqasida keladi."
    invalid:
      - "Sanani o'qiy olmadim. Misollar: `05.03.1998`, `05.03`, `5-mart, 1998`, `1998-03-05`. Yana urinib ko'ring."
  time:
    set:
      - "Eslatma vaqti: *{time}* (sizning mahalliy vaqtingiz)"
    invalid:
      - "Bu vaqtga o'xshamaydi. Misollar: `12:00`, `18`, `8:05`."
  zone:
    choose: "Ro'yxatdan mintaqangni tanla yoki o'zingnikini kirit:"
    set:
      - "Vaqt mintaqasi: *{zone}*. Jadval qayta hisoblandi."
    invalid:
      - "Bunday mintaqani bilmayman. Misollar: `Asia/Tashkent`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Eslatmalar *yoniq*. Jadval bo'yicha yozaman."
    "off": "Eslatmalar *o'chiq*. Tugma yoki /notify orqali qayta yoqing."
  answer:
    days_to: "Tug'ilgan kunga {days} {days|plural:one=kun|other=kun} qoldi. Tabrik {date} sanasida {time} vaqtida {zone} mintaqasida keladi."
    days_since: "Tug'ilgan kundan beri {days} {days|plural:one=kun|other=kun} o'tdi. Siz {age} {age|plural:one=yosh|other=yosh}dasiz."
    days_since_last: "Oxirgi tug'ilgan kundan beri {days} {days|plural:one=kun|other=kun} o'tdi."
    no_year: "Sanada yil yo'q, shuning uchun tug'ilgan kundan beri jami kunlarni hisoblay olmayman. Oxirgi tug'ilgan kundan sanash yilsiz ham ishlaydi: quyidagi tugma buni bajaradi. Yoshni ham ko'rish uchun yilni qo'shing: /date"
    not_set: "Tug'ilgan sana hali ko'rsatilmagan. Boshlaymizmi? /date"
  settings:
    view:
      - "*Sizning sozlamalaringiz*"
      - ""
      - "Tug'ilgan sana: {date}"
      - "Eslatma vaqti: {time}"
      - "Vaqt mintaqasi: {zone}"
      - "Eslatmalar: {notify}"
      - "Til: {lang}"
    not_set: "ko'rsatilmagan"
    "on": "yoniq"
    "off": "o'chiq"
  lang:
    choose: "Tilni tanlang:"
    set: "Til almashtirildi: {lang}"
  cancelled: "Bekor qilindi. Hech qanday sozlama o'zgartirilmadi."
  reloaded: "Xabarlar va klaviaturalar YAML'dan qayta o'qildi."
  perm:
    not: "Bu buyruq faqat bot egasi uchun."

  delete:
    confirm:
      - "Barcha ma'lumotlaringiz (sana, sozlamalar, eslatmalar tarixi) o'chirilsinmi?"
      - ""
      - "Bu qaytarilmas: profil va yetkazish jurnali o'chiriladi."
    done: "Ma'lumotlar o'chirildi. /start orqali qayting"
  pointer:
    dm: "Shaxsiy xabarlarda javob berdim"
  flood: "Juda tez. Bir necha soniyadan so'ng urinib ko'ring."
  about:
    - "*Birthday Bot* ochiq rivojlanadi: manba kodi ommaviy."
    - ""
    - "Manba kod GitHub'da: {url}"
    - "Loyihani yakkama-yakka rivojlantiraman va yulduzcha uchun minnatdor bo'laman. Bu shuningdek IT Management'ga kirish uchun portfelim."
    - ""
    - "Foydalanayotganingiz uchun rahmat."

reminder:
  countdown:
    - "Tug'ilgan kuningizga {days} {days|plural:one=kun|other=kun} qoldi!"
    - ""
    - "Tabrik {date} sanasida {time} vaqtida {zone} mintaqasida keladi. Xayrli kun!"
  birthday:
    - "*Tug'ilgan kuningiz bilan!* Siz {age} {age|plural:one=yosh|other=yosh}ga kirdingiz."
    - ""
    - "Xayrli kun va ajoyib yil."
  birthday.no_year:
    - "*Tug'ilgan kuningiz bilan!* Bugun sizning kuningiz."
    - ""
    - "Xayrli kun va ajoyib yil."

