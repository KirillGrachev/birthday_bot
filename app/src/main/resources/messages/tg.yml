message:
  start:
    - "*Салом!* Ман рӯзҳои таваллудро пайгирӣ мекунам ва ягон санаи муҳимро аз даст намедиҳам."
    - ""
    - "Санаи таваллудатро нишон деҳ, ва ман ҳисоб ва табрикро дақиқ дар вақт, дар минтақаи вақтии ту ва бо забони ту мефиристам."
  help:
    - "*Чӣ корда метавонам*"
    - ""
    - "/date: санаи таваллудро нишон деҳ ё иваз кун"
    - "/notify: ёдраскуниҳоро фаъол ё хомӯш кун"
    - "/daysto: рӯзҳо то рӯзи таваллуд"
    - "/dayssince: рӯзҳо аз рӯзи таваллуд"
    - "/time: вақти ёдраскунӣ"
    - "/zone: минтақаи вақтӣ"
    - "/lang: забон"
    - "/settings: ҳамаи танзимот якҷоя"
    - ""
    - "Ёдраскунӣ ҳар рӯз дар вақти интихобшуда меоянд, ва дар худи рӯз табрик мегирӣ. Пас аз бозоғоз ҳеҷ чиз гум намешавад."
  prompt:
    date:
      - "Санаи таваллудатро дар ягон шакли қулай ворид кун:"
      - ""
      - "`05.03.1998`, `05.03`, `5 марти 1998`, `1998-03-05`"
      - ""
      - "Сол ихтиёрӣ аст, вале бе он синну солро ҳисоб карда наметавонам. Бекоркунӣ: /cancel"
    time:
      - "Вақти ёдраскуниро ворид кун, масалан `12:00` ё `18`. Бекоркунӣ: /cancel"
    zone:
      - "Минтақаи вақтиро ворид кун, масалан `Asia/Dushanbe` ё `UTC+3`. Бекоркунӣ: /cancel"
  date:
    set:
      - "Нигоҳ дошта шуд: *{date}*"
      - ""
      - "То рӯзи таваллуд {days} {days|plural:one=рӯз|other=рӯз} монд. Ёдраскунӣ соати {time} дар минтақаи {zone} меоянд."
    invalid:
      - "Санаро хонда натавонистам. Мисолҳо: `05.03.1998`, `05.03`, `5 марти 1998`, `1998-03-05`. Боз кӯшиш кун."
    year_range: "Ин сол ба хато монанд аст: {year}. Санаҳои таваллудро аз 1900 то имрӯз қабул мекунам."
  time:
    set:
      - "Вақти ёдраскунӣ: *{time}* (вақти маҳаллии ту)"
    invalid:
      - "Ин ба вақт монанд нест. Мисолҳо: `12:00`, `18`, `8:05`."
  zone:
    choose: "Аз рӯйхат минтақаатро интихоб кун ё худатро ворид кун:"
    set:
      - "Минтақаи вақтӣ: *{zone}*. Ҷадвал аз нав ҳисоб шуд."
    invalid:
      - "Чунин минтақаро намедонам. Мисолҳо: `Asia/Dushanbe`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Ёдраскунӣ *фаъол*. Мувофиқи ҷадвал менависам."
    "off": "Ёдраскунӣ *хомӯш*. Бо тугма ё /notify боз фаъол кун."
  answer:
    days_to: "То рӯзи таваллуд {days} {days|plural:one=рӯз|other=рӯз} монд. Табрик {date} соати {time} дар минтақаи {zone} меояд."
    days_since: "Аз рӯзи таваллуд {days} {days|plural:one=рӯз|other=рӯз} гузашт. Ту {age} {age|plural:one=сола|other=сола} ҳастӣ."
    days_since_last: "Аз охирин рӯзи таваллуд {days} {days|plural:one=рӯз|other=рӯз} гузашт."
    no_year:
      - "Дар сана сол нест, бинобар ин шумораи умумии рӯзҳо аз таваллуд ҳисоб намешавад. Ҳисоб аз охирин рӯзи таваллуд бе сол ҳам кор мекунад: тугмаи поён онро мекунад."
      - "  Барои дидани синну сол солро илова кун: /date"
    not_set: "Санаи таваллуд ҳанӯз нест. Оғоз мекунем? /date"
  settings:
    view:
      - "*Танзимоти ту*"
      - ""
      - "Санаи таваллуд: {date}"
      - "Вақти ёдраскунӣ: {time}"
      - "Минтақаи вақтӣ: {zone}"
      - "Ёдраскунӣ: {notify}"
      - "Забон: {lang}"
    not_set: "нишон дода нашудааст"
    "on": "Фаъол"
    "off": "Хомӯш"
  lang:
    choose: "Забонро интихоб кун:"
    set: "Забон иваз шуд: {lang}"
  cancelled: "Бекор шуд. Ҳеҷ танзиме тағйир наёфт."
  reloaded: "Паёмҳо ва клавиатураҳо аз YAML аз нав хонда шуданд."
  perm:
    not: "Ин фармон танҳо барои соҳиби бот аст."

  delete:
    confirm:
      - "Ҳамаи маълумоти ту (сана, танзимот, таърихи ёдраскунӣ) нест карда шавад?"
      - ""
      - "Ин баргаштнок нест: профил ва журнали фиристодан нест мешаванд."
    done: "Маълумот нест шуд. Тавассути /start баргард"
  pointer:
    dm: "Дар паёмҳои шахсӣ ҷавоб додам"
  flood: "Хеле тез. Чанд сония дигар кӯшиш кун."
  about:
    - "*Birthday Bot* кушод таҳия мешавад: коди манбаъ оммавӣ аст."
    - ""
    - "Коди манбаъ дар GitHub аст: {url}"
    - "Лоиҳаро танҳо инкишоф медиҳам ва барои ситора сипосгор мешавам. Ин инчунин портфолиои ман барои дохилшавӣ ба IT Management аст."
    - ""
    - "Ташаккур, ки истифода мебарӣ."

reminder:
  countdown:
    - "То рӯзи таваллудат {days} {days|plural:one=рӯз|other=рӯз} монд!"
    - ""
    - "Табрик {date} соати {time} дар минтақаи {zone} меояд. Рӯзи хуб!"
  birthday:
    - "*Рӯзи таваллудат муборак!* Ту {age} {age|plural:one=сола|other=сола} шудӣ."
    - ""
    - "Рӯзи хуб ва соли аҷоиб."
  birthday.no_year:
    - "*Рӯзи таваллудат муборак!* Имрӯз рӯзи ту аст."
    - ""
    - "Рӯзи хуб ва соли аҷоиб."

