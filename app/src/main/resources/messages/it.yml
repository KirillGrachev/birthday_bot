message:
  start:
    - "*Ciao!* Seguo i compleanni e non perdo mai una data importante."
    - ""
    - "Imposta la tua data di nascita e invierò il conto alla rovescia e gli auguri puntuali, nel tuo fuso orario e nella tua lingua."
  help:
    - "*Cosa so fare*"
    - ""
    - "/date: imposta o modifica la data di nascita"
    - "/notify: accendi o spegni i promemoria"
    - "/daysto: giorni mancanti al compleanno"
    - "/dayssince: giorni trascorsi dalla nascita"
    - "/time: orario del promemoria"
    - "/zone: fuso orario"
    - "/lang: lingua"
    - "/settings: tutte le impostazioni in una volta"
    - ""
    - "I promemoria arrivano ogni giorno all'ora scelta, e il giorno stesso ricevi gli auguri. Non si perde nulla, nemmeno dopo un riavvio."
  prompt:
    date:
      - "Inserisci la tua data di nascita nel formato che preferisci:"
      - ""
      - "`05.03.1998`, `05.03`, `5 marzo 1998`, `1998-03-05`"
      - ""
      - "L'anno è facoltativo, ma senza non posso calcolare la tua età. Annulla: /cancel"
    time:
      - "Inserisci l'orario del promemoria, per esempio `12:00` o `18`. Annulla: /cancel"
    zone:
      - "Inserisci il fuso orario, per esempio `Europe/Rome` o `UTC+3`. Annulla: /cancel"
  date:
    set:
      - "Salvato: *{date}*"
      - ""
      - "Mancano {days} {days|plural:one=giorno|other=giorni} al compleanno. I promemoria arriveranno alle {time} nel tuo fuso {zone}."
    invalid:
      - "Non sono riuscito a leggere la data. Esempi: `05.03.1998`, `05.03`, `5 marzo 1998`, `1998-03-05`. Riprova."
  time:
    set:
      - "Orario del promemoria: *{time}* (la tua ora locale)"
    invalid:
      - "Non sembra un orario. Esempi: `12:00`, `18`, `8:05`."
  zone:
    choose: "Scegli il tuo fuso dall'elenco o inserisci il tuo:"
    set:
      - "Fuso orario: *{zone}*. Programma ricalcolato."
    invalid:
      - "Non conosco questo fuso. Esempi: `Europe/Rome`, `UTC+3`, `America/New_York`."
  notify:
    "on": "I promemoria sono *attivi*. Scriverò secondo il programma."
    "off": "I promemoria sono *disattivati*. Riattivali con il pulsante o con /notify."
  answer:
    days_to: "Mancano {days} {days|plural:one=giorno|other=giorni} al compleanno. Gli auguri arriveranno il {date} alle {time} nel tuo fuso {zone}."
    days_since: "Sono passati {days} {days|plural:one=giorno|other=giorni} dalla tua nascita. Hai {age} {age|plural:one=anno|other=anni}."
    days_since_last: "Sono passati {days} {days|plural:one=giorno|other=giorni} dal tuo ultimo compleanno."
    no_year: "La data non ha l'anno, quindi il totale dei giorni dalla nascita non si può calcolare. Il conto dall'ultimo compleanno funziona anche senza anno: lo fa il pulsante qui sotto. Aggiungi l'anno per vedere anche l'età: /date"
    not_set: "Nessuna data di nascita ancora. Cominciamo? /date"
  settings:
    view:
      - "*Le tue impostazioni*"
      - ""
      - "Data di nascita: {date}"
      - "Orario del promemoria: {time}"
      - "Fuso orario: {zone}"
      - "Promemoria: {notify}"
      - "Lingua: {lang}"
    not_set: "non impostata"
    "on": "attivi"
    "off": "disattivati"
  lang:
    choose: "Scegli la lingua:"
    set: "Lingua cambiata: {lang}"
  cancelled: "Annullato. Nessuna impostazione è stata toccata."
  reloaded: "Messaggi e tastiere riletti dallo YAML."
  perm:
    not: "Questo comando è solo per il proprietario."

  delete:
    confirm:
      - "Eliminare tutti i tuoi dati (data, impostazioni, storico dei promemoria)?"
      - ""
      - "È irreversibile: profilo e registro delle consegne saranno cancellati."
    done: "Dati eliminati. Torna con /start"
  pointer:
    dm: "Ho risposto nei messaggi diretti"
  flood: "Troppo veloce. Riprova tra qualche secondo."
  about:
    - "*Birthday Bot* è sviluppato apertamente: il codice sorgente è pubblico."
    - ""
    - "Il codice sorgente è su GitHub: {url}"
    - "Sviluppo il progetto da solo e apprezzerei una stella. È anche il mio portfolio per la candidatura a IT Management."
    - ""
    - "Grazie per averlo usato."

reminder:
  countdown:
    - "Mancano {days} {days|plural:one=giorno|other=giorni} al tuo compleanno!"
    - ""
    - "Gli auguri arriveranno il {date} alle {time} nel tuo fuso {zone}. Buona giornata!"
  birthday:
    - "*Buon compleanno!* Compi {age} {age|plural:one=anno|other=anni}."
    - ""
    - "Buona giornata e ottimo anno."
  birthday.no_year:
    - "*Buon compleanno!* Oggi è il tuo giorno."
    - ""
    - "Buona giornata e ottimo anno."

