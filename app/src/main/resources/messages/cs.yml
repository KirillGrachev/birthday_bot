message:
  start:
    - "*Ahoj!* Hlídám narozeniny a nikdy nezmeškám důležité datum."
    - ""
    - "Nastav si datum narození a já budu posílat odpočet a přání přesně včas, v tvém časovém pásmu a tvém jazyce."
  help:
    - "*Co umím*"
    - ""
    - "/date: nastavit nebo změnit datum narození"
    - "/notify: zapnout nebo vypnout připomínky"
    - "/daysto: kolik dní zbývá do narozenin"
    - "/dayssince: kolik dní uplynulo od narození"
    - "/time: čas připomínky"
    - "/zone: časové pásmo"
    - "/lang: jazyk"
    - "/settings: všechny nastavení najednou"
    - ""
    - "Připomínky chodí denně v zvolený čas a v samotný den dostaneš přání. Nic se nezmešká, ani po restartu."
  prompt:
    date:
      - "Zadej datum narození v libovolném formátu:"
      - ""
      - "`05.03.1998`, `05.03`, `5. března 1998`, `1998-03-05`"
      - ""
      - "Rok je volitelný, ale bez něj nespočítám věk. Zrušení: /cancel"
    time:
      - "Zadej čas připomínky, například `12:00` nebo `18`. Zrušení: /cancel"
    zone:
      - "Zadej časové pásmo, například `Europe/Prague` nebo `UTC+3`. Zrušení: /cancel"
  date:
    set:
      - "Uloženo: *{date}*"
      - ""
      - "Do narozenin zbývá {days} {days|plural:one=den|few=dny|many=dnů}. Připomínky budou chodit v {time} ve tvém pásmu {zone}."
    invalid:
      - "Datum jsem nepřečetl. Příklady: `05.03.1998`, `05.03`, `5. března 1998`, `1998-03-05`. Zkus to znovu."
    year_range: "Tento rok vypadá jako překlep: {year}. Přijímám data narození od 1900 do dneška včetně."
  time:
    set:
      - "Čas připomínky: *{time}* (tvůj místní čas)"
    invalid:
      - "Tohle nevypadá jako čas. Příklady: `12:00`, `18`, `8:05`."
  zone:
    choose: "Vyber si pásmo ze seznamu, nebo napiš vlastní:"
    set:
      - "Časové pásmo: *{zone}*. Rozvrh přepočítán."
    invalid:
      - "Takové pásmo neznám. Příklady: `Europe/Prague`, `UTC+3`, `America/New_York`."
  notify:
    "on": "Připomínky jsou *zapnuté*. Budu psát podle rozvrhu."
    "off": "Připomínky jsou *vypnuté*. Zapnout je můžeš tlačítkem nebo příkazem /notify."
  answer:
    days_to: "Do narozenin zbývá {days} {days|plural:one=den|few=dny|many=dnů}. Přání přijde {date} v {time} ve tvém pásmu {zone}."
    days_since: "Od narození uplynulo {days} {days|plural:one=den|few=dny|many=dnů}. Je ti {age} {age|plural:one=rok|few=roky|many=let}."
    days_since_last: "Od posledních narozenin uplynulo {days} {days|plural:one=den|few=dny|many=dnů}."
    no_year:
      - "Datum nemá rok, takže celkový počet dní od narození spočítat nelze. Počítání od posledních narozenin funguje i bez roku: tlačítko níže to umí."
      - ""
      - "Přidej rok a uvidíš i věk: /date"
    not_set: "Datum narození zatím není zadané. Začneme? /date"
  settings:
    view:
      - "*Tvoje nastavení*"
      - ""
      - "Datum narození: {date}"
      - "Čas připomínky: {time}"
      - "Časové pásmo: {zone}"
      - "Připomínky: {notify}"
      - "Jazyk: {lang}"
    not_set: "nenastaveno"
    "on": "Zapnuté"
    "off": "Vypnuté"
  lang:
    choose: "Vyber jazyk:"
    set: "Jazyk přepnut: {lang}"
  cancelled: "Zrušeno. Žádného nastavení jsem se nedotkl."
  reloaded: "Zprávy a klávesnice znovu načteny z YAML."
  perm:
    not: "Tento příkaz je jen pro vlastníka."

  delete:
    confirm:
      - "Smazat všechna tvoje data (datum, nastavení, historii připomínek)?"
      - ""
      - "Krok je nevratný: profil i deník doručení budou vymazány."
    done: "Data smazána. Vrať se přes /start"
  pointer:
    dm: "Odpověděl jsem v přímých zprávách"
  flood: "Příliš rychle. Zkus to za pár sekund."
  about:
    - "*Birthday Bot* vzniká otevřeně: zdrojový kód je veřejný."
    - ""
    - "Zdrojový kód je na GitHubu: {url}"
    - "Projekt vyvíjím sám a budu rád za hvězdičku. Je to i moje portfolio pro přihlášku na IT Management."
    - ""
    - "Díky, že to používáš."

reminder:
  countdown:
    - "Do tvých narozenin zbývá {days} {days|plural:one=den|few=dny|many=dnů}!"
    - ""
    - "Přání přijde {date} v {time} ve tvém pásmu {zone}. Hezký den!"
  birthday:
    - "*Všechno nejlepší k narozeninám!* Je ti {age} {age|plural:one=rok|few=roky|many=let}."
    - ""
    - "Hezký den a skvělý rok."
  birthday.no_year:
    - "*Všechno nejlepší k narozeninám!* Dnes je tvůj den."
    - ""
    - "Hezký den a skvělý rok."

